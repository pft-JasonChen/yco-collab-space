schemaVersion: 1
status: active
owner:
  actor: pm
  id: collab-space-owner
actors:
  - id: pm
    label: Product manager
  - id: designer
    label: Designer
  - id: rd
    label: Research and development
  - id: qa
    label: Quality assurance
  - id: manager
    label: Manager reviewer
  - id: agent
    label: AI agent
stages:
  - id: intake
    kind: lifecycle
    allowedActors: [pm, agent]
    requiredArtifacts: [pm-product-source]
    exitApprovals: [pm]
  - id: pm-prototype-working
    kind: lifecycle
    allowedActors: [pm, agent]
    requiredArtifacts: [pm-product-source, generated-prototype]
    exitApprovals: [pm]
  - id: pm-review
    kind: lifecycle
    allowedActors: [pm, manager, agent]
    requiredArtifacts: [frozen-revision]
    exitApprovals: [pm]
  - id: design-working
    kind: lifecycle
    allowedActors: [designer, pm, agent]
    requiredArtifacts: [design-library, generated-prototype]
    exitApprovals: [designer]
  - id: design-review
    kind: lifecycle
    allowedActors: [designer, manager, pm, agent]
    requiredArtifacts: [frozen-revision]
    exitApprovals: [designer, pm]
  - id: design-final
    kind: lifecycle
    allowedActors: [designer, pm, agent]
    requiredArtifacts: [frozen-revision, approved-design-selection]
    exitApprovals: [designer, pm]
  - id: rd-handoff
    kind: downstream
    allowedActors: [pm, rd, agent]
    requiredArtifacts: [frozen-revision]
    exitApprovals: [pm]
  - id: qa-spec
    kind: downstream
    allowedActors: [pm, qa, agent]
    requiredArtifacts: [frozen-revision, qa-human-spec]
    exitApprovals: [pm]
  # --- product-page track (added 2026-09-02) ---
  - id: page-brief
    kind: lifecycle
    track: product-page
    allowedActors: [pm, agent]
    requiredArtifacts: [page-source]
    exitApprovals: [pm]
  - id: page-generated
    kind: lifecycle
    track: product-page
    allowedActors: [pm, designer, rd, agent]
    requiredArtifacts: [page-source, page-generated, page-spec-review]
    exitApprovals: [pm]
  - id: page-pm-review
    kind: lifecycle
    track: product-page
    allowedActors: [pm, manager, agent]
    requiredArtifacts: [page-frozen-revision]
    exitApprovals: [pm]
  - id: page-strapi-draft
    kind: lifecycle
    track: product-page
    allowedActors: [pm, rd, agent]
    requiredArtifacts: [page-frozen-revision, strapi-publish-evidence]
    exitApprovals: [pm]
  - id: page-published
    kind: downstream
    track: product-page
    allowedActors: [pm, rd]
    requiredArtifacts: [page-frozen-revision, strapi-publish-evidence]
    exitApprovals: [pm]
transitions:
  - id: intake-to-working
    from: intake
    to: pm-prototype-working
    approvals: [pm]
  - id: working-to-pm-review
    from: pm-prototype-working
    to: pm-review
    approvals: [pm]
  - id: pm-review-revision
    from: pm-review
    to: pm-prototype-working
    approvals: [pm]
  - id: pm-review-to-design
    from: pm-review
    to: design-working
    approvals: [pm]
  - id: design-to-review
    from: design-working
    to: design-review
    approvals: [designer]
  - id: design-review-revision
    from: design-review
    to: design-working
    approvals: [designer]
  - id: design-review-to-final
    from: design-review
    to: design-final
    approvals: [designer, pm]
  - id: final-to-rd
    from: design-final
    to: rd-handoff
    approvals: [pm]
    parallelOutput: true
  - id: final-to-qa
    from: design-final
    to: qa-spec
    approvals: [pm]
    parallelOutput: true
  # --- product-page track ---
  - id: page-brief-to-generated
    track: product-page
    from: page-brief
    to: page-generated
    approvals: [pm]
  - id: page-generated-to-pm-review
    track: product-page
    from: page-generated
    to: page-pm-review
    approvals: [pm]
  - id: page-pm-review-revision
    track: product-page
    from: page-pm-review
    to: page-brief
    approvals: [pm]
  - id: page-pm-review-to-strapi-draft
    track: product-page
    from: page-pm-review
    to: page-strapi-draft
    approvals: [pm]
  - id: page-strapi-draft-revision
    track: product-page
    from: page-strapi-draft
    to: page-brief
    approvals: [pm]
  - id: page-strapi-draft-to-published
    track: product-page
    from: page-strapi-draft
    to: page-published
    approvals: [pm, rd]
    parallelOutput: true
artifacts:
  - id: pm-product-source
    owner: pm
    path: features/{feature}/product/**
    nature: source
  - id: design-library
    owner: designer
    path: design-library/**
    nature: source
  - id: feature-design-record
    owner: designer
    path: features/{feature}/design/**
    nature: source
    status: proposed
  - id: generated-prototype
    owner: agent
    path: features/{feature}/generated/**
    nature: derived
  - id: validation-evidence
    owner: agent
    path: features/{feature}/evidence/**
    nature: derived
  - id: frozen-revision
    owner: pm
    path: features/{feature}/releases.json
    nature: record
  - id: approved-design-selection
    owner: designer
    path: features/{feature}/generated/generation.json
    nature: record
    status: proposed
  - id: qa-human-spec
    owner: qa
    path: features/{feature}/specs/**
    nature: derived
    status: proposed
  # --- product-page track ---
  - id: product-library
    owner: pm
    track: product-page
    path: product-library/**
    nature: source
  - id: design-pattern-library
    owner: designer
    track: product-page
    path: design-library/patterns/product-page/**
    nature: source
  - id: strapi-registry
    owner: rd
    track: product-page
    path: strapi/**
    nature: source
  - id: page-source
    owner: pm
    track: product-page
    path: product-pages/{page}/source/**
    nature: source
  - id: page-generated
    owner: agent
    track: product-page
    path: product-pages/{page}/generated/**
    nature: derived
  - id: page-spec-review
    owner: agent
    track: product-page
    path: product-pages/{page}/generated/review/**
    nature: derived
  - id: strapi-publish-evidence
    owner: agent
    track: product-page
    path: product-pages/{page}/evidence/publish/**
    nature: derived
  - id: page-frozen-revision
    owner: pm
    track: product-page
    path: product-pages/{page}/releases.json
    nature: record
systems:
  - id: figma
    owner: designer
    direction: input
    visibility: private
    productionDataAllowed: false
  - id: private-github
    owner: pm
    direction: both
    visibility: private
    productionDataAllowed: false
  - id: local-workspace
    owner: pm
    direction: both
    visibility: private
    productionDataAllowed: false
  - id: public-preview
    owner: pm
    direction: output
    visibility: public-selected-assets-only
    productionDataAllowed: false
  - id: rd-repository
    owner: rd
    direction: output
    visibility: private
    productionDataAllowed: true
  - id: yco-spec
    owner: qa
    direction: output
    visibility: private
    productionDataAllowed: false
  - id: strapi-admin
    owner: rd
    direction: output
    visibility: private
    productionDataAllowed: true
indexes:
  features: .collab-cache/features-index.json
  designLibrary: .collab-cache/design-library-index.json
  productLibrary: .collab-cache/product-library-index.json
  strapiRegistry: .collab-cache/strapi-registry-index.json
workflows:
  - id: prototype-intake
    actors: [pm, agent]
    readablePaths:
      - collab-space.map.yaml
      - features/{feature}/**
      - design-library/**
    writablePaths:
      - features/{feature}/product/**
      - features/{feature}/design/design-gaps.yaml
      - features/{feature}/releases.json
    protectedPaths:
      - platform
      - design-library
    enforcement: error
  - id: prototype-update
    actors: [agent]
    readablePaths:
      - collab-space.map.yaml
      - features/{feature}/product/**
      - features/{feature}/design/**
      - design-library/**
      - platform/**
    writablePaths:
      - features/{feature}/generated/**
      - features/{feature}/evidence/**
      - .prototype-state/**
      - .collab-cache/**
    protectedPaths:
      - collab-space.map.yaml
      - features/{feature}/product
      - features/{feature}/design
      - design-library
      - platform
    enforcement: error
  - id: design-library-upload
    actors: [designer]
    readablePaths:
      - design-library/**
    writablePaths:
      - design-library/assets/**
      - design-library/tokens/**
      - design-library/components/**
      - design-library/patterns/**
    protectedPaths:
      - features
      - platform
    enforcement: warning
  - id: component-foundation-pilot
    actors: [pm, designer, rd, agent]
    readablePaths:
      - collab-space.map.yaml
      - design-library/**
      - platform/ui/**
      - platform/tokens/**
      - features/{feature}/design/**
      - features/{feature}/generated/**
    writablePaths:
      - design-library/components/**
      - design-library/assets/**
      - platform/ui/**
      - .storybook/**
      - tools/design-library/**
      - docs/architecture/**
      - docs/design-system/**
      - package.json
      - package-lock.json
      - prototype.config.json
    protectedPaths:
      - features/{feature}/product
      - features/{feature}/generated
      - platform/tokens/rd
      - .env
    enforcement: error
  # --- product-page track ---
  - id: product-page-brief
    track: product-page
    actors: [pm, agent]
    readablePaths:
      - collab-space.map.yaml
      - features/**
      - product-library/**
      - design-library/patterns/product-page/**
      - strapi/**
      - product-pages/{page}/**
    writablePaths:
      - product-pages/{page}/source/**
      - product-pages/{page}/releases.json
    protectedPaths:
      - features
      - product-library
      - design-library
      - strapi
      - platform
      - product-pages/{page}/generated
    enforcement: error
  - id: product-page-generate
    track: product-page
    actors: [agent]
    readablePaths:
      - collab-space.map.yaml
      - features/**
      - product-library/**
      - design-library/**
      - strapi/**
      - platform/tokens/**
      - platform/surfaces/**
      - product-pages/{page}/source/**
      - product-pages/{page}/releases.json
    writablePaths:
      - product-pages/{page}/generated/**
      - product-pages/{page}/evidence/**
      - .prototype-state/**
      - .collab-cache/**
    protectedPaths:
      - collab-space.map.yaml
      - features
      - product-library
      - design-library
      - strapi
      - platform
      - product-pages/{page}/source
      - product-pages/{page}/releases.json
    enforcement: error
  - id: product-page-publish
    track: product-page
    actors: [agent, pm, rd]
    readablePaths:
      - collab-space.map.yaml
      - strapi/**
      - product-pages/{page}/generated/**
      - product-pages/{page}/releases.json
    writablePaths:
      - product-pages/{page}/evidence/**
    protectedPaths:
      - features
      - product-library
      - design-library
      - strapi
      - platform
      - product-pages/{page}/source
      - product-pages/{page}/generated
    enforcement: error
  - id: product-library-update
    track: product-page
    actors: [pm]
    readablePaths:
      - product-library/**
      - features/**
    writablePaths:
      - product-library/**
    protectedPaths:
      - design-library
      - strapi
      - platform
      - product-pages
    enforcement: warning
  - id: design-pattern-update
    track: product-page
    actors: [designer]
    readablePaths:
      - design-library/**
      - strapi/components/**
      - platform/tokens/**
    writablePaths:
      - design-library/patterns/product-page/**
      - design-library/skills/**
    protectedPaths:
      - features
      - product-library
      - strapi
      - platform
      - product-pages
    enforcement: warning
  - id: strapi-registry-update
    track: product-page
    actors: [rd]
    readablePaths:
      - strapi/**
      - design-library/patterns/product-page/**
    writablePaths:
      - strapi/**
    protectedPaths:
      - features
      - product-library
      - design-library
      - platform
      - product-pages
    enforcement: warning
rules:
  - id: mock-only-prototypes
    status: active
    enforcement: error
    actors: [pm, designer, agent]
    stages:
      - intake
      - pm-prototype-working
      - pm-review
      - design-working
      - design-review
      - design-final
    decisionBasis:
      - Collab Space prototypes never connect to a backend or contain production data.
  - id: human-git-path-enforcement
    status: proposed
    enforcement: warning
    actors: [pm, designer, rd, qa]
    stages:
      - intake
      - pm-prototype-working
      - pm-review
      - design-working
      - design-review
      - design-final
    decisionBasis:
      - Human CODEOWNERS and protected paths require team review before enforcement.
  # --- product-page track ---
  - id: claim-provenance
    track: product-page
    status: active
    enforcement: error
    actors: [agent]
    stages:
      - page-generated
      - page-pm-review
      - page-strapi-draft
    decisionBasis:
      - Every generated claim, benefit or step must cite a PM spec or product-library source so reviewers can prove nothing exceeds the PM spec.
  - id: independent-spec-review
    track: product-page
    status: active
    enforcement: error
    actors: [agent]
    stages:
      - page-generated
      - page-pm-review
      - page-strapi-draft
    decisionBasis:
      - The subagent that reviews content against the PM spec must not be the builder that wrote it, and its verdict is bound to the content hash it reviewed.
  - id: strapi-draft-only
    track: product-page
    status: active
    enforcement: error
    actors: [agent, pm, rd]
    stages:
      - page-strapi-draft
      - page-published
    decisionBasis:
      - Automation may only create or update Strapi draft entries; publishing to the live site stays a human action inside Strapi.
decisionBasis:
  - The contract is the control plane for roles, stages, paths and external-system boundaries.
  - Shared design resources live once in the global Design Library; feature revisions pin exact selections.
  - Agent and validator rules are enforced now, while human Git enforcement remains proposed.
  - The Product Owner authorised the component-foundation pilot so Designer, RD and Agent can iteratively adjust shared components and Storybook without changing feature product behaviour.
  - The product-page track reuses the same actors and path-ownership model; PM, Designer and RD each own one library folder and the agent only writes derived page output.
