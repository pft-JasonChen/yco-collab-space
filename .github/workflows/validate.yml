name: Prototype validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rendered -- --feature video-expansion
      - run: npm run test:rendered -- --feature collab-space-readiness
      - run: npm run test:surfaces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-evidence
          path: |
            features/*/evidence/
            work/surface-evidence/
