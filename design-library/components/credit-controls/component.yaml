decisionBasis:
  - The header balance and Generate cost share the RD production credit asset but accept synthetic values through pure props.
  - The PO approved balance 436 and Generate cost 10 without credit-service or purchase behavior.
  - Generate preserves the RD single-tool brand, disabled, loading and credit-pill states rather than inheriting the generic neutral button treatment.
