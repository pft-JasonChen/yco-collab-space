decisionBasis:
  - "Promoted from the RD port (2026-09-15) for Cloud Storage. RD's my-gallery-page/components/gallery-grid owns the justified layout every gallery family renders, and the algorithm is load-bearing rather than incidental: each cell's width is `rowHeight * ratio` and its `flex-grow` is that same number, so a row stretches up from the 200px base to fill the container, while a `maxWidth` of `240 * ratio` makes 240 a hard ceiling rather than a suggestion. Hand-rewriting that from a screenshot produces rows that look approximately right and drift under mixed ratios, which is exactly what validate:geometry exists to catch."
  - "`.afterSeat` with `flex-grow: 9999999` absorbs the leftover space on the final incomplete row so its cells keep base size and stay left-aligned. Without it a lone portrait on the last row stretches to the full container width and renders as a giant cell — RD's own comment records this, and it is kept verbatim."
  - "The 2-column masonry is built as two explicit flex columns rather than CSS `column-count`, because iOS Safari fails to resolve an aspect-ratio box's height inside a multicol fragmentation context and collapses the second column. Items are packed greedily into the shorter column, with height taken as 1/ratio since both columns are equal width. Carried over unchanged from RD."
  - "Single deviation from the RD source (2026-09-15): RD switches to the masonry via `useWindowDevice().isMd`, which reads the real browser viewport. That hook is replaced by a ResizeObserver on the grid's own element plus an explicit `layout` prop. Two reasons, both precedent in this pilot: a viewport-width hook ignores a narrow wrapper entirely, so a fixed-width Storybook story could never render the masonry — the same failure navigation-header hit with @media and solved with container queries — and the masonry needs greedy column packing in JS, which a pure CSS container query cannot express, so a ResizeObserver is the JS equivalent of the container query the rest of this pilot uses. RD can reverse this by swapping the observer back for its own hook; nothing else in the file changed, which is why portability stays drop-in."
  - "`layout` defaults to `auto`. Before the first ResizeObserver callback the grid renders justified, matching RD's own server-render behaviour where `isMd` starts false."
  - "The two ratio helpers travel with the component rather than staying separate: `useMediaRatios` measures true dimensions off-DOM (an image's naturalWidth, a video's videoWidth — a video's poster ratio can differ from the clip's, so the clip itself is measured) and `aspectRatio.js` supplies the metadata fallback and `bucketRatio`. Both are ported from src/components/my-gallery-page/hooks/use-media-ratios.js (sha256 0f5eb7f9c5db2b47…) and use-aspect-ratio.js (sha256 ad55dfaa6afa5531…). Neither file is in the vendored baseline subset, so they are named in this entry from migration/rd-intake-inventory.json rather than listed under sourceHashes, which would imply a local file validate:rd-parity could actually check."
  - "`tokens.uses` is empty and the SCSS declares no colour at all: this component is pure layout, and every colour in a gallery belongs to the cell it renders. That keeps the grid reusable for Projects, Images, Videos, Uploads and Trash without a per-family variant."
  - "Stories cover the one axis Controls cannot express — justified versus masonry — because the breakpoint is a measured width, not a prop. The masonry story forces `layout` inside a 375px wrapper rather than relying on the preview viewport, which is the concrete case the ResizeObserver change exists to support. `rowHeight` and `layout` stay as Controls; items, the render callbacks and onErroredSrc are pulled from the Controls table under the same 'not actually editable there' convention this pilot applies elsewhere."
