decisionBasis:
  - "Extracted from RD source on 2026-09-15 for Cloud Storage's level-one tab row, per the shared component workflow: no replacement UI was designed. RD splits this across two directories — my-gallery-page/components/tab for the tab itself and common/drag-scroll-wrapper for the strip's pointer-drag scrolling — and they are promoted together because a tab row without the drag behaviour is not the production interaction."
  - "portability is `reference`. RD's tab calls `getTranslationFunction()` internally and receives a translation key; a shared component in this library never translates, so `label` is the resolved string and the consumer owns the key. RD's wrapper also depends on `browserUtils.isTouchDevice()` and a global `hidden-scrollbar` utility class, and its momentum hook imports `lodash/defaults`. All four are replaced, so RD keeps its own implementation."
  - "Service substitutions (2026-09-15): `browserUtils.isTouchDevice()` becomes `matchMedia('(pointer: coarse)')` combined with `navigator.maxTouchPoints`, still read after mount so a server render never assumes a pointer device; the global `hidden-scrollbar` class becomes a local rule; `lodash/defaults` becomes an object spread with identical semantics."
  - "Behavioural fix carried in the port (2026-09-15): RD's use-momentum-tracking keeps `momentum` and `momentumID` in module-level `let` bindings, so every mounted wrapper shares one velocity record and one animation frame. With RD's single gallery row that is invisible; a shared component can be mounted more than once, where the second instance would cancel the first's animation and inherit its velocity. Both now live in refs, one set per instance. The decay curve itself is unchanged: no coast after a 200ms pause, exponent `min((|dx|+|dy|)**0.5 / 3, 0.95)`, stop below 0.1."
  - "The drag-versus-click guard moved into the component (2026-09-15). RD's gallery checks the wrapper's `moved` flag in its own onClick before switching tab, so a flick across the row does not also select. Leaving that to each consumer would mean every future gallery re-implements it or silently loses it, so the row owns the check and still exposes `moved` through the imperative handle for a consumer that needs it."
  - "The tab element is a `<button>` rather than RD's `<div>` (2026-09-15). RD's div carries a click handler with no role, tabindex or keyboard handling, so the row is unreachable by keyboard. A real button restores that for free and renders identically once the browser defaults are reset. The active tab also carries `aria-current='page'`, matching how result-page-shell's tool menu marks its active item."
  - "Colour mapping (2026-09-15), following app/src/surfaces/rd-port/token-colour-mapping.json: `rgb(9 22 26 / 95%)` -> `--text-strong` (#09161af2), recorded there as exact within 8-bit alpha rounding. One approximation: the red dot's `#e62d82` -> `--fill-badge` (#f23b77), a visibly different pink. That is the canonical record's own classification, carried here rather than re-decided, and it stays pending Designer definition."
  - "RD's `.activeTab` colours the label with `--text-brand` but draws no underline; the sliding indicator is the gallery page's own element, not the tab's. This component keeps that split and adds only the hairline under the whole row, so a consumer that wants an animated indicator can still supply one."
