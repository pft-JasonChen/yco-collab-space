decisionBasis:
  - "Extracted from RD source on 2026-09-15 for Cloud Storage's purchase flow, per the shared component workflow: no replacement UI was designed. RD's two-column composition is kept — benefits on the left, the offer switcher and plan cards on the right, checkout beneath — along with its single-offer pill, discount line-through and save badge."
  - "portability is `reference`, and the gap is large. RD's modal reads redux, derives every displayed value from its pricing SKU model (currency lookup, cycle division, holiday promotion discount), and composes a currency service, a countdown, a loading skeleton and Stripe checkout. A prototype must not carry a commerce engine and must not call a payment provider, so this component takes already-resolved display strings — price, original price, save percent — and exposes checkout as a plain callback. RD keeps its own implementation."
  - "Inline-JS colour audit (2026-09-15). This is the component the surface handoff's warning was really about: RD holds its three most visible colours not in SCSS but in a JS style table in hooks/use-holiday-styles.js, where the raw-colour scanner never sees them. `token-colour-mapping.json` does not record any of them, and a passing token validator therefore said nothing about this surface. The default-theme entries are mapped here for the first time: the active Plus tab's `radial-gradient(#44E3ED 0%, #03ADE2 49.02%)` becomes `--blue-dark-1000` to `--fill-brand-strong`; the active Pro tab's `linear-gradient(#FFB802, #FFA51C, #FF8800)` becomes `--yellow-solid-1000` to `--amber-light-1000`; the plan card's `border: 1px solid #03ade2` becomes `--fill-brand-strong`, exact; and the checkout fill `#03ade2` likewise. All four are now classes rather than inline objects, so the policy can see them from here on."
  - "Two inline colours had no token and no prior record (2026-09-15). The selected plan card's `#eafbff` is an opaque pale cyan; the closest available is `--blue-dark-200` (#a3eaff33), which composites over white to roughly #edfbff — visually near but translucent where RD is opaque, so it will shift if the card is ever placed on a non-white ground. The Pro gradient's third stop `#FF8800` collapses onto `--amber-light-1000` (#ef9b00), the same token as its second stop, so a three-stop ramp becomes two-stop — the same collapse recorded on category-rail's gradient. Both pending Designer definition."
  - "Colours the canonical record does cover are carried from it: `#fff` -> `--fill-white` (exact); `#03ade2` -> `--fill-brand-strong` (exact); `#44e3ed` -> `--blue-dark-1000` and `#ffb802` -> `--yellow-solid-1000`, `#ffa51c` -> `--amber-light-1000`, all three approximate."
  - "Missing dialog role fixed, not carried (2026-09-15). The surface acceptance recorded that the IAP overlay opens without a dialog role, and warned its passing open/close test was not a keyboard or focus verdict. This component renders through the shared Modal from confirm-dialog with `ariaLabelledBy` always supplied, so it is a real `role='dialog'` with `aria-modal`, focus-on-open, focus-restore-on-close, a Tab trap and Escape-to-close. The dependency on confirm-dialog mirrors RD, whose pricing modal imports the same common/modal its delete dialog does."
  - "Button consolidation (2026-09-15, PM requested): checkout now renders the Designer-approved shared Button as Primary/Brand/Medium. The pricing component keeps only its full-width layout class; Button owns padding, typography, states and color. The RD reference preview uses the same component, and its scoped global reset was lowered with `:where(button)` so component classes retain authority."
  - "Not ported (2026-09-15): the four seasonal themes (halloween, blackfriday, christmas, endyear), the countdown, the plans skeleton, the currency selector, MorePlanLink and the Stripe path. The seasonal tables are dormant branches keyed off a holiday hook this prototype has no source for, and TOKEN-MIGRATION.md already notes its own counts include dormant branches. `secondaryAction` occupies MorePlanLink's position so a consumer can put its own entry there — Cloud Storage uses it for Expand storage only."
  - "The tab row is a real `role='tablist'` of buttons with `aria-selected`, where RD uses click-handling divs — the same keyboard-reachability repair made on gallery-tabs. Plan cards are buttons with `aria-pressed` for the same reason."
