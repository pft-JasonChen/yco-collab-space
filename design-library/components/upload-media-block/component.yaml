decisionBasis:
  - RD already exposes upload-image-block as a common media surface used by video features.
  - The pure-props port preserves the uploaded-video preview, duration badge, remove and replace actions while allowing a feature-owned action slot.
  - The empty and loaded structures retain the RD common component geometry; feature code may supply an action slot but does not own either upload state.
  - Production file handling, preview modals, state, translations and telemetry are deliberately excluded.
  - "Round 2 extension (2026-09-11): added `type='startEnd'|'multiple'|'template'` (Figma's wider UploadArea family, nodes 4515:64126 / 10525:145816 in file jb5SgyshmuPse0L7IFm0QO — no RD counterpart for these three, same 'figma-only' situation as platform/ui/empty-image, but this component's own portability stays 'drop-in' since the original type='single' RD port is still the majority of its surface), plus an independent `showToggle`/`errorMessage`/`showHint` row set usable with any type. `type='single'` (the original port) is behaviourally unchanged — verified no regression against the pre-existing VideoUploaded/Empty stories and the live Video Expansion usage. New icons (crop, swap, info, error, toggle-on/off) added to design-library/assets/icon/yco-upload-media-block/, pulled directly from Figma."
  - "sync-component-specs note (2026-09-11): this file's localFiles hashes were updated by hand, not by tools/design-library/sync-component-specs.mjs — that tool's prop-detection regex doesn't handle this component's now much longer multi-line destructured signature and flags every one of the pre-existing props (imageUrl, videoUrl, etc.) as 'no longer found' even though none were removed. The same false-positive already affected video-history, video-info-dialog, video-timeline and video-trim-modal before this round (pre-existing, unrelated to this change) — worth fixing the tool's prop scanner separately, out of scope here."
  - "The scanner bug in the note directly above is now fixed (2026-09-15, found while chasing an unrelated CI failure): tools/design-library/sync-component-specs.mjs's extractDestructuredPropNames rewritten to walk brace depth and strip comments before splitting on top-level commas, instead of a single-level regex that broke on any nested-brace default value or inline JSDoc. sync:component-specs:check now correctly reports this file (and video-history/video-info-dialog/video-timeline/video-trim-modal) as prop-unchanged rather than false-flagging every prop."
  - "Video thumbnail given a play affordance and a muted indicator, not just the duration badge (2026-09-15, requested live — \"1除了時間還有play和volume\", comparing this against video-expansion's own settings-panel upload block, which only showed the duration): same icon-font-glyph + color-mix(80%-opacity) treatment as VideoTrimModal's own preview overlay (icon-ic-play-f U+E97F / icon-ic-volume-x-f U+E926), scaled down (32px/20px circles vs. that modal's 56px/40px) for this block's own much smaller ~112px-tall preview. Both are decorative only — added to the `type='single'`+`videoUrl` branch's `.preview`, which has no inline playback state of its own; `onPreview` (the whole button's onClick) is still what actually opens a real preview. Added a local @font-face (same YcoInterfaceIcons/icomoon.woff every other icon-font consumer in this codebase declares per-module)."
  - "Both overlay icons corrected to 24×24, dark-overlay style, not the 32px/20px white-bg guess above (2026-09-15, requested live — \"play icon是小小顆在中間，PM不想蓋影片太多\" — against Figma node 14877:145017's own uploadArea instance, which Codex independently found while processing this component's sync-queue entry and flagged the size mismatch): that node's two circular overlay controls are both 24×24, --fill-overlay background, --icon-inverse-strong glyph — the same style .previewMuted already used, not VideoTrimModal's white-80%-opacity/--icon-brand treatment .previewPlay had borrowed (a much bigger preview surface where that size/contrast reads correctly; here it covered more of a small thumbnail than intended). Position kept centered per the same feedback (\"在中間\"), just at the smaller, subtler size/color actually specified."
  - "`.previewPlay` moved from centered-in-the-whole-preview (top:50%/left:50%) onto the same bottom row as `.previewMuted`/`.duration` — same `bottom: var(--spacing-4)`, only translateX for centering (2026-09-15, requested live — \"這三排的水平高度應該要一樣都在底部\"): all three now share one y-position instead of play floating well above the other two."
