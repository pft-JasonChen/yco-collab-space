decisionBasis:
  - The PM required the RD common Ratio component with i18n, GTM and Lodash removed.
  - The public shape stays compatible with the existing Video Expansion integration.
  - The PO approved an Image Extender-derived presentation variant while retaining the RD common Ratio API as the sole public component.
  - "Option icon shape (2026-09-06): each option's icon used to be sized via a per-ratio `padding` string supplied by the consuming feature (e.g. `'11.375px 7px'` for 16:9) — hand-picked values that didn't reliably reproduce the real w:h proportions and had to be re-derived by hand for every new ratio. Per Figma's Aspect Ratio reference (node 14572:211035, file jb5SgyshmuPse0L7IFm0QO), the icon should read as the option's actual aspect ratio. Replaced with a `shapeStyle(item)` helper computed directly from the `w`/`h` already on each ratio-list item (contain-fit within the icon box, centered) — removes the need for any hand-authored per-ratio constant, in Storybook's own mock data or in a consuming feature's generated code. Verified in Storybook (rendered icon width:height matches each option's real ratio to 2 decimal places) and confirmed this auto-propagates to Video Expansion with no changes to that feature's generated code, since it imports this component live rather than a copy."
  - "Icon corner radius and Image Extender wrapper size (2026-09-06): the option icon's corner radius used the same --corner-radius-4 token as the outer card, but Figma's reference (node 14572:211035) uses a smaller 2px radius on the icon shape specifically — no matching token exists below 4px, so hardcoded per Designer instruction. Separately, the Image Extender variant's icon wrapper was sized larger (--spacing-40 box / --spacing-4 padding) than the default gery/gery_v2 wrapper for no functional reason; Designer asked for one shared size, so the Image Extender-specific wrapper override was removed."
  - "Disabled state (2026-09-06): unlike Button, Ratio is a composite (container + icon block + label) rather than a single text/fill/border triplet, so per Designer convention it doesn't get its own disabled colour tokens the way Button does — disabled composite components uniformly fade via `opacity: 0.3` on the whole option instead of re-deriving a disabled colour for every sub-part. Confirmed against Figma's own Aspect Ratio disabled state (Opacity 30% on the group). `.ratioContainer:disabled` is now `opacity: 0.3` (plus `cursor: not-allowed`), with no per-variant colour overrides underneath it."
  - "Current local hashes after the 2026-09-06 changes above: `Ratio.jsx` → 163587d11f357a3a88aaca8b8f569f7f1041ff8642c6df9d4be85a3affe500dc; `Ratio.module.scss` → 9b03ba4791f86de6c2aaa2662a464f8c5619e4dc00c05e5158608806c7e36d83. Same deliberate-divergence status as button's and credit-controls' own component.yaml — pending Designer/RD canonical review, not silently claimed as already approved."
  - "Auto-sync (2026-09-05): `README.md` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Designer canonical review approved 2026-09-06: current implementation reviewed and signed off. RD canonical review still pending."
  - "Icon size, option gap and label typography corrected against a live Figma Dev Mode inspect of node 15012-276926 (2026-09-15): icon wrapper 36px outer/22px inner → 32px outer/18px inner (\"ratio色塊有點大，以1:1為例，我的是18px你的是22px\" — .ratioWrapper's own +4px addition on top of --spacing-32 dropped); gery_v2's option gap 4px (falling through to the base .content rule, no override existed) → 8px (\"這個是8px不是4px\"); .ratioText's Typography spec read Small/Bold·16/24 but was tiny/weak·14/20 on all three properties, not just weight (\"數字是用bold不是regular\") — corrected to font-size/line-height/font-weight all matching Small/Bold."
  - "`ratioTypes.IMAGE_EXTENDER` added; `.image_extender`-suffixed CSS merged into the `.gery_v2` rules it needs to match, `rd.portability` downgraded verbatim → reference and `ratioTypes.js`'s verbatimFiles pledge dropped accordingly (2026-09-15, reported live — \"image extender被你亂改掉了，figma有記錄明明是長這樣才對\", with a Figma-recorded before/after showing this variant as the same icon-left/label-right row gery_v2 renders, its icon corner radius 4px→2px — already true here via the shared .ratioBorder rule): `ratioTypes.js` (a verbatim copy of RD's own src/components/common/ratio/utils/ratioTypes.js, confirmed against platform/rd-baseline/yce-frontend-gm-260909 — RD's real file also has no IMAGE_EXTENDER key) never actually exported this key, even though Ratio.jsx/Ratio.module.scss/Ratio.stories.jsx all already referenced `ratioTypes.IMAGE_EXTENDER` — every consumer got `undefined`, which Ratio's own `variant = ratioTypes.GERY_V2` default parameter silently turned into GERY_V2, so this variant had never actually been reachable. Its own then-CSS (flex-direction:column, 74px min-height, solid-fill-when-active) never matched anything in Figma as a result. Fixed by adding the real key (an intentional divergence from RD's upstream file, not a copy error — hence the portability downgrade) and merging every `.image_extender`-suffixed rule into its `.gery_v2` counterpart, since the record shows them pixel-identical; kept as a separately-selectable variant rather than deleted, per instruction. video-expansion's own AspectRatioSection was switched from `ratioTypes.IMAGE_EXTENDER` to `ratioTypes.GERY_V2` explicitly (\"video expansion 不要用這個variant，用一般的Five Ratios 那個variant就好\") — a no-op visually, since that's what it was already silently falling back to, but now correct rather than accidental."
  - "Option card border corrected 2px --stroke-weak → 1px --stroke-strong (2026-09-15, reported live with a Figma inspect — \"我的border只有1px誒，你的看起來比較粗\"): Figma's own Stroke panel read Position: Inside, Weight: 1, with the --grey-light-200 swatch (--stroke-strong), not the lighter --grey-light-100 (--stroke-weak) this had been using — both the width and the token were wrong, not just one."
  - "Selected-state border given its own 2px width, not just a color swap on the unselected 1px (2026-09-15, reported live with a Figma inspect — \"被選中的是2px\"): Figma's selected Stroke panel reads Weight: 2 against Stroke/Selected — safe against layout shift since app/src/styles/global.scss applies box-sizing: border-box globally, so the extra 1px eats into the box's own padding rather than growing it."
  - "Reverted the 2026-09-15 `.image_extender`→`.gery_v2` CSS merge documented in the entry above (2026-09-16, reported live — \"我昨天好像有和你說，image extender左邊才是對的\" / \"你after反而改錯了\"): that merge was based on a misread of an unrelated corner-radius record and wrongly deleted image_extender's own distinct vertical-column/solid-fill-when-selected layout in favor of gery_v2's icon-left/label-right row. `.content.image_extender`, `.ratioContainer.image_extender`, `.ratioContainerActive.image_extender`, `.ratioBorder.image_extender`, `.ratioBorderActive.image_extender` (desktop and mobile) are restored to their pre-4da2d78 values, verified against the user's own before/after screenshot (the vertical/solid-fill \"before\" half is the correct one). `ratioTypes.IMAGE_EXTENDER` itself stays — that key genuinely didn't exist before and was a real bug independent of this layout question — as does video-expansion's own switch to `ratioTypes.GERY_V2` (a separate, still-valid instruction: \"video expansion 不要用這個variant，用一般的Five Ratios 那個variant就好\"). `.ratioWrapper`/`.ratioText` (icon size, label typography) are shared across all variants, not image_extender-specific, and were not touched by either the original merge or this revert."
  - "Auto-sync (2026-09-16): `Ratio.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
