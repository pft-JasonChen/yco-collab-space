decisionBasis:
  - Header and tool-family menu exist in RD but require a pure-props port because their production implementations depend on routing, state, accounts and analytics.
  - Active tool labels use an existing accessible information token because the RD cyan label measures 2.59:1 on white in axe; the icon and selected fill retain the brand treatment.
  - The PM approved a presentational Result Page shell with AI Video active and an inert synthetic credit balance of 436.
  - Feature titles may hide the optional information action when no information surface exists.
  - "Round 2 sidebar fixes (2026-09-11): the active tool's text/icon color was --text-information (teal, #1a74a8) — the only use of that token family anywhere in platform/ui, and mismatched against its own selected-state fill (--fill-brand-weak, brand family). Every other active/brand state (Button's tone_brand variants) pairs --text-brand with brand fills, so this was a genuine one-off bug, not an intentional second color family; corrected to --text-brand. Separately, hover/press states were missing or wrong: hover incorrectly reused the selected-state fill (--fill-brand-weak) instead of a neutral wash, and there was no press state at all. Added --fill-hover (hover), --fill-press (press) matching Button's own hover/press convention, plus Active Hover (--teal-dark-50 + --stroke-selected ring) and Active Press (--fill-brand-press + --stroke-selected ring) per Figma's MenuList component (node 13026:43818, file JXNIQPJT9I9qFrgtiaCn4i) — a full state matrix that wasn't implemented at all before. Divider and inter-button spacing were also rebuilt to match Figma's NavigationSide (node 13028:53081) exactly: the 80px icon column's own edge-to-edge divider (was incorrectly spanning the full 112px rail including the rail's own gutter padding) and flat 8px flex gaps between buttons (was accumulated margin/padding that drifted from spec). Also split the pre-existing defaultToolFamilies data array out of ResultPageShell.jsx into its own file — it was tripping Vite's react-refresh 'consistent-components-exports' check every edit (a component file exporting a plain data array alongside its components can't Fast Refresh)."
  - "Account button size fix (2026-09-14, reported from the browser inspector): .account was 48px, which doesn't match any of Button's real size steps (32/36/42/56) — corrected to 42px (Button's 'medium' step), same convention the Round 2 Generate-button fix already established for this header. SUPERSEDED the same day by the ProductHeader/NavigationHeader merge below — .account no longer exists in this file at all, this class lived on ProductHeader which this shell no longer renders. Left here as a historical record of the fix, not a live rule."
  - "headerActions gap fix (2026-09-14, reported from the browser inspector): the gap between CreditControl and the account button was --spacing-16 (16px); corrected to --spacing-12 (12px). SUPERSEDED the same day by the header merge below — .headerActions no longer exists in this file."
  - "Account icon -> icon font (2026-09-14, suggested): swapped the account button's <img src={profileIcon}> for the YcoInterfaceIcons 'ic-user' glyph (U+E92B, same font already loaded for ToolFamilyMenu's .glyph icons), matching UploadMediaBlock's earlier icon-font precedent. Encountered one real transient bug worth recording: removing the profileIcon import and updating the JSX that used it were two separate edits, and Vite's dev server hot-reloaded the in-between state (import gone, usage not yet updated), throwing a real 'profileIcon is not defined' crash that a screenshot caught live — resolved once both edits landed together and the page was reloaded, not a lingering issue. SUPERSEDED the same day by the header merge below — this shell's own account button (and the accountGlyph/icon-font approach) no longer exists; the account button now comes from NavigationHeader's own image-based Avatar instead."
  - "Mobile header swap (2026-09-14, confirmed from an annotated screenshot): below 768px, ProductHeader was replaced outright by platform/ui/navigation-header rather than squeezed into a mobile layout of its own. IMPORTANT GAP flagged at the time: NavigationHeader's own mobile row had no credits or title slot at all, so the page title and credit balance were no longer visible in the mobile header. SUPERSEDED the same day, see the header-merge entry directly below, which closes this exact gap by merging the two components instead of leaving desktop on one component and mobile on another."
  - "ProductHeader/NavigationHeader merge (2026-09-14, explicit request: 'merge into the same component, no need to split by whether it's inside Result Page Shell, because there is no such distinction'). This shell had its own desktop-only ProductHeader (title/info/credits/account) alongside platform/ui/navigation-header's marketing-site header, which the previous entries above already had swapping in for ProductHeader at mobile widths only — two separate components for what turned out not to be a real distinction. ProductHeader is now deleted entirely (function, .stories.jsx, and every one of its own CSS classes — .productHeader/.brand/.account/.accountGlyph/.titleGroup/.logoSymbol/.wordmark/.headerActions); this shell renders NavigationHeader unconditionally at every width instead of picking between two wrapper divs, relying on NavigationHeader's own container-query breakpoints for the desktop/tablet/mobile switch. `title`/`showInfo`/`onInfo` map onto NavigationHeader's featureNameText/showFeatureName(always true here)/showFeatureInfo/onInfo; `mobileUserType` is renamed plain `userType` since it's no longer mobile-specific. NavigationHeader itself gained creditBalance/showCredits/onCredits (rendered next to Avatar on the wide row, and — closing the gap flagged above — also on the mobile row, ungated by any Figma reference since the merged combination didn't exist in the original marketing-header frames; it reuses CreditControl's own existing responsive behavior rather than a new bespoke compact treatment) — see navigation-header's own component.yaml for the full rationale. YcoInterfaceIcons/`.glyph` stays in this file's CSS — ToolFamilyMenu's icon column still uses it — only the header-specific classes were removed."
  - "`.toolMenuScroller` scrollbar restyled (2026-09-16, requested live — \"scrollbar在沒有滾動的時候可以不要顯示嗎？顏色也太深了，可以用Stroke/Weak\"): this scroll container had no scrollbar styling at all, so it rendered the browser's own default (thick, dark) scrollbar whenever the tool-family list overflowed its available height. Same transparent-by-default/`--stroke-weak`-on-hover treatment as category-rail's own `.scroller`."
  - "Auto-sync (2026-09-16): `ResultPageShell.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "`.glyph` font-size corrected to 20px (2026-09-18, requested live via a DevTools inspect — \"這裏font size 是20px才對，你現在是22px\", against ._glyph_nnjef_144 { font-size: 20px }): was 22px. This is the ToolFamilyMenu icon-column glyph, not NavigationHeader's own separate avatarGlyph (22px, a different element entirely, confirmed unaffected)."
  - "Auto-sync (2026-09-18): `ResultPageShell.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
