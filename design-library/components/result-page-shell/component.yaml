decisionBasis:
  - Header and tool-family menu exist in RD but require a pure-props port because their production implementations depend on routing, state, accounts and analytics.
  - Active tool labels use an existing accessible information token because the RD cyan label measures 2.59:1 on white in axe; the icon and selected fill retain the brand treatment.
  - The PM approved a presentational Result Page shell with AI Video active and an inert synthetic credit balance of 436.
  - Feature titles may hide the optional information action when no information surface exists.
  - "Round 2 sidebar fixes (2026-09-11): the active tool's text/icon color was --text-information (teal, #1a74a8) — the only use of that token family anywhere in platform/ui, and mismatched against its own selected-state fill (--fill-brand-weak, brand family). Every other active/brand state (Button's tone_brand variants) pairs --text-brand with brand fills, so this was a genuine one-off bug, not an intentional second color family; corrected to --text-brand. Separately, hover/press states were missing or wrong: hover incorrectly reused the selected-state fill (--fill-brand-weak) instead of a neutral wash, and there was no press state at all. Added --fill-hover (hover), --fill-press (press) matching Button's own hover/press convention, plus Active Hover (--teal-dark-50 + --stroke-selected ring) and Active Press (--fill-brand-press + --stroke-selected ring) per Figma's MenuList component (node 13026:43818, file JXNIQPJT9I9qFrgtiaCn4i) — a full state matrix that wasn't implemented at all before. Divider and inter-button spacing were also rebuilt to match Figma's NavigationSide (node 13028:53081) exactly: the 80px icon column's own edge-to-edge divider (was incorrectly spanning the full 112px rail including the rail's own gutter padding) and flat 8px flex gaps between buttons (was accumulated margin/padding that drifted from spec). Also split the pre-existing defaultToolFamilies data array out of ResultPageShell.jsx into its own file — it was tripping Vite's react-refresh 'consistent-components-exports' check every edit (a component file exporting a plain data array alongside its components can't Fast Refresh)."
