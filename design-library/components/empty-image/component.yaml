decisionBasis:
  - "New component (2026-09-11): Figma's 'Empty Image' illustration (node 13023:12548, file JXNIQPJT9I9qFrgtiaCn4i) is a full page x type matrix with no corresponding RD implementation in the vendored youcam-enhance-frontend@1.34.1 snapshot — Video Expansion's own empty state was hand-rolled (a single Icon in a colored box) rather than using a shared component. rd.portability is 'figma-only' for exactly this reason: there is nothing in RD's codebase to point sourcePaths/sourceHashes at, so both are left as empty arrays rather than filled with fabricated paths. This is the first component in this pilot to use that portability value; the schema itself (tools/design-library/schemas/component-contract.schema.json) was extended the same day to make sourcePaths/sourceHashes conditionally optional only when portability is figma-only — every other existing component still requires them."
  - "Scope (2026-09-11): only type='video' is implemented against real per-type layout data transcribed from Figma's dev-mode output. The other 9 types (general, edt, t2i, i2v, t2v, face-swap-photo, face-swap-video, upload-drag, voice-microphone) are declared in the `type` values list and have their SVG assets already downloaded to design-library/assets/icon/yco-empty-state/, matching Figma's real specification for each, but the component returns null for those types until a feature actually needs one (per the 'don't build ahead of real consumers' convention established this pilot) — do not read the full values list as 'fully implemented'."
  - "background prop naming (2026-09-11): 'base' renders the grey-fill artwork (for placement on a --background-base/white page) and 'sunken' renders the white-fill artwork (for a --background-sunken/alternate page) — the artwork's own fill is the OPPOSITE of what the prop name might suggest at a glance, because the prop names the page surface the component sits on, not the artwork's own color. Types with only one Figma-specified fill (t2v, face-swap-photo, face-swap-video, upload-drag) ignore this prop and always render their one asset."
