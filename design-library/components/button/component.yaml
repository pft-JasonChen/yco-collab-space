decisionBasis:
  - The RD variant API is portable once browser detection, locale links and production tracking hooks are removed.
  - button.module.css is held VERBATIM against the RD copy at src/components/common/button-wrapper/button.module.css; the file itself declares that the two repositories stay identical, so no Collab Space-only edit may live in it.
  - An earlier pilot revision substituted --text-strong for --text-inverse-strong and --text-information for --text-brand to clear an axe colour-contrast finding. That silently diverged the prototype's brand buttons from production, so the substitution was reverted on 2026-09-02 at PM request; the 2.59:1 brand pairing is now carried as recorded a11y debt for Designer and RD canonical review rather than hidden by a token swap.
  - Pilot approval permits Collab Space prototype use but does not claim production package compatibility.
  - "Figma component set (node 3433:80097, https://www.figma.com/design/JXNIQPJT9I9qFrgtiaCn4i/-Comp-YCO_web_components_2025?node-id=3433-80097) defines Tone=Brand/Neutral/Inverse/Destructive only; `Button.module.css` itself labels the other two tones \"Custom: warning/success (not in designer spec, used for legacy ffc700/0ea639)\". Designer confirmed on 2026-09-02 that `warning`/`success` are not used on Button anywhere in current design or product usage, and RD confirmed the same day that Collab Space does not need to expose either tone. `publicApi.tone.values` was narrowed to [brand, neutral, destructive, inverse] accordingly, and the Storybook `tone` control was narrowed to match. This is scoped to the Collab Space prototype only: `platform/ui/button/Button.jsx` and the verbatim `Button.module.css` still contain the underlying warning/success implementation (now unreachable through the contract) because both files are sourceHash-locked against the real `youcam-enhance-frontend` files and were not edited — removing the legacy CSS/JS from production, if desired, is a separate RD-repo decision with its own new snapshot and hashes."
  - "Component-level design gaps (as distinct from the per-feature `features/*/design/design-gaps.yaml` files) are recorded here in `decisionBasis` as a provisional convention. The long-term schema for shared design-library component gap tracking is still open — see `docs/design-system/phase1-designer-rd-foundation-guide.md` §16 (\"Designer extension 與 RD baseline 衝突\")."
  - "Disabled-state colour: Figma (node 5133:63281) uses a flat, tone-independent grey fill (`Fill/Disabled` variable) for every tone/variant row, not a faded version of the button's own colour; Primary keeps light text (`Text/Inverse strong`) against that grey fill, while Secondary/Tertiary (no fill behind the text) use the muted grey text instead — confirmed against a full-sheet Figma screenshot and against `platform/ui/credit-controls/CreditControls.module.scss`'s pre-existing `.generateButton:disabled` override, which already had to patch around this same gap for its own Button usage. Implemented 2026-09-06 under `component-foundation-pilot`'s Designer+RD+Agent authorisation to iterate on `platform/ui/**`: `.ycoButton:disabled` binds `--fill-disabled`/`--text-inverse-strong`/`--icon-inverse-strong` (all pre-existing RD tokens); `.variant_secondary:disabled`/`.variant_tertiary:disabled` override to `--text-disabled`/`--icon-disabled`/`--stroke-disabled`. Declared after the tone/variant rules so equal-specificity source order makes it win over the old `opacity: 0.5`. This is a deliberate, known divergence from the recorded RD snapshot — `rd.sourceHashes` above is left untouched on purpose, since it documents production at snapshot time, not this file now (see the end of this list for the current local hash). Outstanding: Designer/RD canonical review must decide whether to backport this to production `youcam-enhance-frontend` or revert it."
  - "Padding structure: Figma (node 16360:105306) nests the label text in its own \"Label container\" with 4px padding each side, inside the button's own outer padding — giving edge-to-text = outer padding + 4px, and icon-to-text gap = flex gap + 4px, at every size. `Button.module.css`'s `.label` had no padding of its own. Implemented 2026-09-06: `.label { padding: 0 var(--spacing-4); }`, letting every size_* rule's existing outer padding/gap compose with it automatically. Same deliberate-divergence status as the colour fix — pending RD canonical review / backport decision."
  - "Loading spinner: `isLoading` previously added no visible indicator beyond dimming the label and setting `aria-busy`/`disabled` — Figma's component set has no `Loading` variant to check against (only Default/Hover/Press/Focus/Disabled), so this is an RD-side gap Figma can't adjudicate. Implemented 2026-09-06: `Button.jsx` renders a CSS-only spinner (`.spinner` — a `conic-gradient` ring masked hollow, faded smoothly around its circumference to match `design-library/assets/icon/yco-credit-controls/loading.png`'s actual pixel data rather than a hard-edged gap, `currentColor`-based so it recolours per tone/variant automatically) in the trailing-icon slot whenever `isLoading` is true, replacing `trailingIcon`; `leadingIcon` is unaffected. No new prop. `platform/ui/credit-controls/CreditControls.jsx` no longer renders its own `loading.png` for this same state — that asset is unused for now (kept in `design-library/assets/`, not deleted, in case something else still needs it) rather than duplicating an indicator Button already provides. Same deliberate-divergence status as the other fixes above."
  - "Height mismatch on 2 of 4 sizes: Figma's component set gives exact rendered heights of Tiny=32px, Small=36px, Medium=42px, Large=56px (read directly off the symbol frames, e.g. \"Type=Primary, Tone=Brand, State=Default, Size=Medium\" is 84×42). `Button.module.css`'s `.size_*` rules bind `min-height` to the closest available RD spacing token instead: Tiny→`--spacing-32` (32px, matches) and Large→`--spacing-56` (56px, matches) are correct by coincidence, but Small→`--spacing-40` (40px, Figma wants 36px) and Medium→`--spacing-48` (48px, Figma wants 42px) are both off — because the RD spacing scale has no `--spacing-36`/`--spacing-42` token to bind to at all (only 32/40/48/56 exist). Unlike the colour/padding/spinner fixes above, this one is NOT implemented: minting a new spacing token would mean writing into `platform/tokens/rd/**`, which `component-foundation-pilot`'s own `protectedPaths` explicitly excludes from this workflow's write access — Designer/Agent iteration on `platform/ui/**` does not extend to inventing RD token values. Flagged for RD canonical review to decide the real Small/Medium height (new tokens, or confirm 36/42 should round up to the existing 40/48 scale) before this gets touched in code."
  - "Current local hashes after the 2026-09-06 pilot fixes (colour, padding, spinner), for anyone diffing against the sourceHashes above: `Button.jsx` → 710b33a42c24501336039564ba9b9d33d952d1085fc4f28a5812ee677fd1e3e2; `Button.module.css` → 47910e83b81b46d4d130bcf9322b1caf01604977ad6fcbaf1d99fade2768a851. `platform/ui/credit-controls/CreditControls.jsx` and `.module.scss` also changed (spinner de-duplication above) — see that component's own component.yaml for its hashes."
  - "Designer canonical review approved 2026-09-06: current implementation reviewed and signed off. RD canonical review still pending."
