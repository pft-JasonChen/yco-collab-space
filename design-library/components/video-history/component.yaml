decisionBasis:
  - RD video-feature provides shared filtering, History list, result-card and video-player surfaces across video-producing modules.
  - The pilot exposes synthetic item data and callbacks instead of production task fetching, polling, download and routing behavior.
  - Action buttons use the allowlisted RD img2Vid Next Action icons; the filter is composed by Video Results Surface instead of duplicated inside the list.
  - Like, dislike, edit and download are delegated to the shared Icon Action Buttons family, mirroring how RD's result-video card composes `video-feature/icon-action-buttons` rather than owning its own action row.
