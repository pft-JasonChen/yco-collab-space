decisionBasis:
  - RD video-feature provides shared filtering, History list, result-card and video-player surfaces across video-producing modules.
  - The pilot exposes synthetic item data and callbacks instead of production task fetching, polling, download and routing behavior.
  - Action buttons use the allowlisted RD img2Vid Next Action icons; the filter is composed by Video Results Surface instead of duplicated inside the list.
  - Like, dislike, edit and download are delegated to the shared Icon Action Buttons family, mirroring how RD's result-video card composes `video-feature/icon-action-buttons` rather than owning its own action row.
  - "Processing card rebuilt against Figma node 4536:162056 (2026-09-17, requested live — \"generating的畫面你做錯了，你沒有修改到，請參考figma\"): was a grey --fill-weaker panel with a spinning ring and dark text, which matched nothing in the design. Figma specifies the generating state as the source still itself — one copy cover-blurred to fill the card, one contained on top, both dimmed under a --fill/overlay-weak (rgba(0,0,0,0.45)) backdrop-blurred scrim — with white Heading-5/Bold title, a Tiny/Regular --text/inverse-weak description whose 'My Gallery' segment is bold/underlined/white, and a determinate 224x10 progress bar (track white@12%, fill a #03ADE2->#3FD75B gradient spanning the FILLED width, read from the node's own bar asset) above a Tiny/Bold percentage. Three new optional item fields carry it: `posterUrl` (already the convention on completed items), `progress` (0-100; the bar and percentage only render when it is a finite number, so a consumer with no progress signal still gets the card), and `processingLinkLabel`. The description keeps a `{{link}}` token — the same replace-token convention `openDetail`/`sourceAlt` already use — so the emphasised segment stays inside one translatable sentence instead of being split across props. `.processing` keeps an opaque --background-inverse base so the white text still has dark backing when no poster is supplied. The spinner and its keyframes are gone; `.failed` is unchanged and no longer shares a rule with `.processing`."
