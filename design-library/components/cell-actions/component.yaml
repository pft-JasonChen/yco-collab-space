decisionBasis:
  - "Extracted from RD source on 2026-09-16 because the PM reported the grid's overflow control was invisible. The cause was using the catalogued dropdown-select in its borderless variant over a photograph: it has no ground, so dark glyphs vanish against a light thumbnail. RD had already solved this — Download and More share one rounded pill with a translucent dark ground and white glyphs — so the fix was to extract that component rather than restyle a toolbar control into an on-photo one."
  - "This is the second menu in the catalogue, and deliberately so. dropdown-select is a toolbar control: light ground, dark text, listbox or menu semantics, keyboard model. This one sits over a photograph: dark glass, backdrop blur, white text, anchored above its trigger. They are two visual languages in production and collapsing them would make one of the two wrong. The keyboard-navigable listbox model is not carried here because RD's is a short on-photo action list rather than a value picker; Escape and outside-click both close it, and the trigger carries aria-haspopup and aria-expanded."
  - "portability is `reference`. RD reads `useWindowDevice()` and `getTranslationFunction()`, imports its download glyph from a fixed asset path, and depends on PropTypes. Labels are props here, the glyph is inlined from RD's own sheet-icons, and the device read becomes a matchMedia on `(pointer: coarse)` taken after mount so a server render never assumes a pointer type. RD keeps its own implementation."
  - "Not ported: the mobile bottom sheet. RD swaps the desktop dropdown for a full action sheet below 992px, which needs a portal, a backdrop and a drag affordance of its own. The narrowest viewport this prototype is reviewed at is 768px — a tablet, not a phone — where the anchored menu reads correctly. What is carried from that branch is the part that matters at any pointer type: on a coarse pointer the More button is always visible rather than hover-revealed, because a touch device has no hover to reveal it with. Recorded here rather than silently dropped; a phone breakpoint would need the sheet."
  - "Grouping is the one addition (2026-09-16): `groupLabel` and `dividerBefore` per item, the same generalisation category-rail and dropdown-select already carry. RD's menu is flat because it holds two or three items; Cloud Storage's holds six across separate intents. A labelled run becomes a real `group` carrying the label as its accessible name, so the menu's children stay valid."
  - "RD's own note on the destructive item is preserved: delete reads white like the rest of the dark menu, distinguished by its trash glyph rather than a red tint, because that is what the guideline shows. The `danger` flag therefore sets a data attribute a consumer can assert on, not a colour."
  - "Colour mapping (2026-09-16) follows app/src/surfaces/rd-port/token-colour-mapping.json, and every value in this component is recorded there: `rgb(17 24 26 / 50%)` pill and icon ground -> `--text-weaker`; `rgb(255 255 255 / 16%)` hover wash and the group divider -> `--grey-neutral-dark-200`; `#fff` -> `--fill-white`; `#15171f` active dots -> `--grey-slate-solid-900`. RD's own tokens (`--fill-overlay-weak`, `--fill-inverse-hover`, `--text-inverse-strong`, the corner radii and the tiny type pair) are unchanged. The one value with no token is the menu shadow's `rgb(0 0 0 / 24%)`, expressed as `color-mix(in srgb, var(--fill-strong) 24%, transparent)` — the convention video-trim-modal, credit-controls and dropdown-select already use."
  - "Two differences from RD's hover rule are deliberate. RD gives the lone icon button its own dark ground and the grouped ones a transparent one; here the pill always carries the ground and the buttons are transparent, with `single` only changing the padding, because RD's separate-ground branch existed for the mobile lone-icon case this port does not ship. And the icon hover wash is applied unconditionally rather than only inside `.grouped`, which is the same result for every case that survives."
