decisionBasis:
  - RD FeatureLayout is the production composition source for settings and results blocks, but its state and device dependencies are replaced with pure props and CSS breakpoints.
  - The PO approved production-surface-first composition for the Video Expansion manager-review prototype.
  - "Auto-sync (2026-09-11): `ToolPageLayout.jsx`, `ToolPageLayout.module.scss` hashes updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "footer given a conditional sticky-vs-static rule instead of always sitting fixed at the panel's own bottom (2026-09-15, requested live — \"如果panel的settings內容多餘裝置高度才是fixed at the bottom，如果沒有就跟著settings的最後一個項目\", node 14877-145015): footer moved from being a separate flex sibling of .panelContent to that same element's own last child, with position: sticky; bottom: 0. At >900px, .panelContent is the actual scrolling container, so this natively gives the requested rule with no JS height-measurement: it renders exactly like static (right after the settings' last item) whenever everything already fits, and only sticks to .panelContent's own bottom edge once the settings are actually tall enough to scroll. At <=900px, .panelContent goes `overflow: visible` (panel and result stack and scroll together as one page there) — sticky would otherwise escape to whatever ancestor does scroll and pin the button mid-screen over the result column, so `.footer{position:static}` restores plain in-flow behavior for that breakpoint, matching what it already did before this change (declared after the base rule in source order — same specificity, so order decides which wins at that width)."
  - "footer spacing given its own explicit rule instead of inheriting a flex gap (2026-09-15, requested live — \"接著settings就不用在包在一個container裡面了，離最後一個container 16px就好\", after the entry above): GenerateActionBar's own .actionBar background+box-shadow (platform/ui/credit-controls/CreditControls.module.scss) were built for a permanently-fixed-bottom-bar treatment and read as an unwanted boxed card now that the footer commonly sits in plain flow — removed, since .footer's own background already covers the sticky case's opacity need. `.panelContent > .footer` (two classes, beats a plain `.panelContent > * + *` sibling-margin rule some consuming feature might use for its own section spacing, regardless of stylesheet load order) sets margin-top: 16px so this one edge doesn't have to match — or double up with — whatever gap/margin value that feature uses between its own settings sections."
  - "`.result` and `.layout` given `overflow: hidden` (2026-09-16, requested live — \"這裡應該要偵測剩下的螢幕空間有多少然後撐滿它，而不是scroll\"): both were flex:1; min-height:0 (or height:100%) with no overflow of their own, so a result-column child taller than the space actually available (surfaced via video-results-surface's own `.editContent`, which has the matching fix — see its component.yaml) rendered past this box's edges instead of being contained by it, inflating every ancestor up to ResultPageShell's own scrollable `main` and scrolling the whole page instead of `.result` simply filling whatever height `.layout` actually has."
  - "`.result`'s stacked-layout (<=900px) sizing corrected, in two steps (2026-09-16, requested live — first \"為什麼後面到一個程度就沒有動了，根本空間還很多，都還沒裁切到內容\", then \"你是不是沒有扣掉其他元件\"): was a flat min-height: 620px, picked once against a specific phone and never revisited — it neither grew with a taller real viewport (a consumer's canvas plateaued well short of the actually available space) nor tracked whatever sits above `.result` (NavigationHeader, a consumer's own tabs/title row). First tried min-height: 100svh directly on `.result` — reverted after test:rendered caught a real regression (tablet/responsive-workspace, `settings-inspector` no longer visible): `.result` is a `flex: 1` (flex-basis: 0%) child of `.layout`'s auto-height column, and a flex item's own min-height doesn't bubble up into an auto-height ancestor's own size calculation — `.layout` computed too short a box for what `.result` actually needed, `overflow: hidden` clipped the excess, and `.panel` (sharing the now-too-small remainder, default flex-shrink:1) got squeezed to 0 height. Fixed instead by giving `.result` a plain flex: none; height: 100% (inheriting `.layout`'s own `min-height: 100%` directly — already the correctly NavigationHeader-subtracted available height, via the ordinary percentage-height chain, with no flex-basis ambiguity) and `.panel` an explicit `flex-shrink: 0` (so it always keeps its full natural content height regardless of what `.result` claims)."
  - "Panel-width and stacking breakpoints corrected to the project's actual shared responsive rules (2026-09-16, requested live — \"我發現你w900就把panel隱藏了 但我們的規則是769~991 panel是 w300, 992以上 panel是 w400, 768以下才是變成手機版\"): every breakpoint above this entry was written against this component's own earlier ad-hoc guesses (1200px for the 320px panel width, 900px for the panel/result stack) rather than the project's real tablet/desktop split. Corrected to `@media (max-width: 991px) { .panel { width: 300px; min-width: 300px; } }` (was 1200px/320px) and `@media (max-width: 767px)` for the stacking block (was 900px) — `.panel` now sizes 400px >=992px, 300px 769-991px, and stacks full-width only <=767px, matching the spec verbatim. Every other consumer that mirrors this component's own stacking breakpoint (video-results-surface's `.mobileTitleRow`, Video Expansion's own feature-level media queries) was updated to the same 767px in the same pass — see their own component.yaml / decisions.md entries."
  - "Auto-sync (2026-09-16): `ToolPageLayout.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Stacked (<=767px) `.layout` given `overflow: visible` (2026-09-16, requested live — \"手機版我只有說upload Area 移除，但是給人家選ratio和generate button還是要在，不然人家怎麼操作\", after a consuming feature had hidden its own upload block on mobile): `.layout`'s base-rule `overflow: hidden` (declared once, for the desktop/tablet side-by-side case) was never overridden in this stacked block — combined with `.result`'s own non-shrinking `height: 100%` and `.panel`'s own `flex-shrink: 0` (both above), the two stacked children's combined natural height regularly exceeds whatever share of one screen a consumer's own `flex: 1` on this component hands `.layout`, and the excess — here, the WHOLE settings-inspector panel (aspect ratio + Generate), not just the upload block the user actually asked to remove — got clipped with no scrollbar, since `overflow: hidden` doesn't scroll. Confirmed live: `.layout`'s own two children measured 956px combined against a 780px box. `overflow: visible` lets that excess escape upward to ResultPageShell's own `.shellContent`, which already goes `overflow: auto` at this same breakpoint specifically to scroll taller stacked mobile content — that was already the intended scroll container, `.layout` just wasn't letting anything reach it."
  - "Auto-sync (2026-09-16): `ToolPageLayout.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
