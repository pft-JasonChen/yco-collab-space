decisionBasis:
  - "Extracted from RD source on 2026-09-15 for Cloud Storage's desktop sidebar, per the shared component workflow: no replacement UI was designed. This was the largest of the five extractions and the only one where RD's component is a page container rather than a presentational one — 632 lines reading next/router, two redux slices, sessionStorage and four hooks, and building its own items from CMS sections plus hard-coded routes."
  - "The split (2026-09-15): the consumer resolves `items` and `activeKey` and owns every navigation side effect; this component owns the markup, styling, roving-tabindex keyboard model and the selected/hover/focus states. RD's item shape is kept verbatim as the prop contract — key, label, icon, iconName, isNew — so a consumer's existing item builder transfers unchanged. RD's own StartEditingButton and GalleryPickerModal are not absorbed: the first is a `leading` slot, the second is a consumer concern with its own modal."
  - "portability is `reference`. Beyond the container dependencies above, RD resolves copy through `getTranslationFunction()` and its labels arrive already translated here, so RD keeps its own implementation."
  - "Two RD behaviours are generalised rather than hard-coded, because a shared component must not carry one consumer's taxonomy. RD draws a divider by testing `it.key === 'video-template'` and again before its API group; that becomes a `dividerBefore` flag per item. RD applies its gradient treatment by testing `data-key=\"contest\"`; that becomes a `gradient` flag. The CSS rules themselves are unchanged — only what selects them."
  - "Icon font (2026-09-15): RD scopes its icomoon classes under a global `.homeCategory` class from src/styles/home-icon-styles.css, which the page loads. A shared component cannot assume a global stylesheet, so the face is declared in this module — the same approach result-page-shell already takes for its own face. The `.icon-ic-*` classes stay `:global` because they are applied by name from the item data and so cannot be module-hashed. The 32 codepoint mappings live in RD's stylesheet, which is listed under sourcePaths."
  - "Font collection duplication, flagged for consolidation (2026-09-15). The face is served from assets/font/yco-category-rail/icomoon.woff, which is byte-identical (sha256 746d8b88…) to assets/font/yco-home-rd/icomoon.woff. The duplicate exists because of a real constraint collision, not preference: library.mjs permits only .woff/.woff2 in a font collection and component-contracts.mjs escalates that warning to a contract error, so any component declaring yco-home-rd fails while that collection also holds the .ttf and .svg that RD ships. Those two are live — app/src/surfaces/rd-port/home-icon-styles.css references them — so removing them would break the RD reference preview, and relaxing the validator is a platform rule change. A woff-only sibling collection was the only option that touched neither. Consolidate when the rd-port preview no longer needs the legacy formats, or when the font-collection rule is revisited."
  - "Inline-JS colour repair (2026-09-15). RD's ExternalLink takes its colour as a JS prop default — `color = '#11181A'`, `fillOpacity = '.65'` — which is a literal the SCSS raw-colour policy never inspects. This is the class of gap the surface handoff flagged when it noted a passing token validator does not prove full coverage. The fill is `currentColor` here, so the glyph follows the row's own colour, including the brand colour a selected or focused row takes; RD's hex is a fixed near-black that does not. The 0.65 opacity is kept."
  - "Colour mapping (2026-09-15) follows app/src/surfaces/rd-port/token-colour-mapping.json. Exact: `#fff` -> `--fill-white`; `#333` -> `--grey-neutral-solid-800`; `rgb(0 0 0 / 2%)` -> `--grey-neutral-light-25`; `rgb(0 0 0 / 4%)` -> `--grey-neutral-light-50`; `rgb(3 173 226 / 5%)` -> `--brand-light-50`; `rgb(126 192 229 / 20%)` -> `--teal-dark-200`; `rgb(17 24 26 / 10%)` -> `--stroke-weak`; and NewLabel's `#f23b77` -> `--fill-badge`."
  - "Colour mapping, the approximations (2026-09-15), all in the gradient row and all carried from the canonical record rather than re-decided: `#6570fa` and `#a153fb` both collapse to `--purple-light-1000` (#7e47cc), so a three-stop indigo-to-violet ramp becomes a two-stop one; `#21cdff` -> `--blue-light-1000` (#03ade2); and the matching background stops `rgb(101 112 250 / 10%)` and `rgb(161 83 251 / 10%)` both collapse to `--purple-light-50`, with `rgb(123 225 255 / 10%)` -> `--blue-dark-50`. The gradient is visibly different from production and stays pending Designer definition. No consumer in this repository uses the gradient flag yet; it exists so the rail does not silently drop a treatment RD ships."
  - "Layout ownership (2026-09-15): RD pins the rail with `position: fixed` against a 64px header offset and switches on `data-is-header-portal` for its mobile menu. Fixed positioning is the host page's decision, so the rail is static here and the consumer places it; the independent scroll container is kept because the list must scroll separately from the page. The `<=992px` icon-over-label treatment is both a media query and a `compact` prop, so a consumer can hold it in step with gallery-grid's measured layout instead of letting the two disagree inside a fixed-width preview."
  - "Keyboard model is RD's, with one addition: RD moves the roving tabindex on arrow keys but never moves focus, so the caret is left behind. Focus follows the index here, but only while focus is already inside the rail, so an external selection change never steals it."
  - "Scroller scrollbar restyled (2026-09-16, requested live — \"scrollbar在沒有滾動的時候可以不要顯示嗎？顏色也太深了，可以用Stroke/Weak\"): `.scroller` had `scrollbar-width: none` with no `::-webkit-scrollbar` counterpart, so Chromium/WebKit contexts that ignore `scrollbar-width` fell back to the browser default (thick, dark) scrollbar instead of actually hiding it. Given a real transparent-by-default/`--stroke-weak`-on-hover treatment instead of a full hide, since this list can genuinely overflow and a hover-revealed thumb is a real affordance, not just decoration."
  - "Auto-sync (2026-09-16): `CategoryRail.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Compared directly against Figma's own Navigation Side node (5847:59397, both the 300px expanded and 112px compact device variants), per a live question — \"我和你說本自己的Navigation side 做起來...這個元件我們先不管他\" (proposed forking a new component) — \"那就修 CategoryRail\" (decided instead to compare and correct this one). Every colour/spacing token already matched exactly through the alias chain (--fill-brand-strong active bg -> --brand-light-50, identical to what this file already used; --fill-badge -> --perfect-1000 -> #f23b77, Figma's literal hex) — this component is already RD-accurate to that Figma node, including the `leading` slot existing specifically for its Start Editing button. The one real box-model difference: `.newLabel` was a fixed 35x15px box; Figma sizes the NEW badge to its own text at a fixed 16px height (line-height-micro) with a full pill radius. Changed to `height: var(--line-height-micro)` (was 15px) and `border-radius: 9999px` (was 12px, a literal that happened to still read as fully-round at that height) — this codebase's own existing fully-round convention (CellActions' badges). Width was left auto rather than re-fixed at 35px; verified live it renders at ~35.3px for \"NEW\" regardless. No new component was created."
  - "Auto-sync (2026-09-18): `CategoryRail.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "CategoryRail story icon corrections (2026-09-18, compared against Figma node 13026:43818): AI Portrait changes `ic-portrait` → `ic-user-sparkle`; My Gallery changes `ic-history` → `ic-image`; Video Template changes `ic-video` → `ic-videos`; Image Template changes `ic-image` → `ic-images`. The first probe only covered the 32-glyph legacy RD font and incorrectly suggested the two template glyphs were unavailable. The user-provided `icomoon-v260907.zip` contains the complete 156-glyph font, including `ic-videos` (U+E991) and `ic-images` (U+E94C), so CategoryRail now uses that font directly and the temporary standalone SVG assets were removed. `CategoryRail.jsx` remains unchanged."
  - "Compact NEW badge placement (2026-09-18, requested live against Figma component node 16505:7716): the badge previously stayed in normal flex flow after the label, producing a third centered row. Figma positions it at the compact item's upper-right corner, overlapping the 72px icon region without changing the item's height. The 80px compact item is now the positioning context and the badge is taken out of flow, pinned to its top-right edge with no margin in both the <=992px media-query path and the explicit compact-prop path."
  - "Auto-sync (2026-09-18): `CategoryRail.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Icons were invisible on every real consumer of this component (cloud-storage, every Storybook story) — reported live against a screenshot of a plain text list, \"icon怎麼都不見了\": this component's own scoped icon block (see the entry above about the `@font-face` being scoped here so a shared component cannot assume a global stylesheet exists) only ever carried font-family/style, never the `::before { content }` codepoint mapping that actually selects a glyph out of the font. That mapping lived only in app/src/surfaces/rd-port/home-icon-styles.css, imported by the Surface Browser's own RD-port preview and nothing this component actually ships with. Transcribed the full codepoint set (32 glyphs, confirmed against a checksum-identical copy of the same font file this component already vendors) directly into this component's own module.scss, closing the gap."
  - "Auto-sync (2026-09-18): `CategoryRail.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Auto-sync (2026-09-18): `CategoryRail.stories.jsx` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Auto-sync (2026-09-18): `CategoryRail.module.scss`, `CategoryRail.stories.jsx` hashes updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Compact icon-state pill rescoped from `.item` to `.iconFont` (2026-09-18, reported live against Figma's own Menu List icon-state matrix, node 13026:43818 — \"hover不會包著文字，我覺得你沒有認真看figma\"): the base hover/press/focus/selected rules paint their background on `.item`, correct for the wide row (Figma's \"Type=List\" states pill the full icon+label row) but wrong for compact's \"Type=Icon\" states, which pill ONLY the 72px icon — the label text below never gets a background at any state. `.item` and every one of its interactive selectors now reset to `background-color: transparent` inside both compact scopes (the <=992px media query and `[data-compact='true']`), with the exact same colour re-applied one level deeper via `.item:<state> .iconFont` — no state's colour changed, only what element it paints on. Verified live: the persistent selected state on `.iconFont` now reads the correct `--brand-light-50` background while `.item` itself is transparent; the previously-reported NEW-badge misalignment on a selected/hovered compact row (badge floating above the icon with a gap) turned out to be a symptom of this same bug — the erroneous full-item pill was pushing the icon down away from the badge's `top: 0` anchor — and is now also fixed with no separate change."
  - "Auto-sync (2026-09-18): `CategoryRail.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
