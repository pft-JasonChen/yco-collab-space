decisionBasis:
  - RD owns like, dislike, edit and download once in `video-feature/icon-action-buttons`, and consumes it from both the History result card and the Next Action footer of the detail dialog; Video History and Video Info Dialog now compose the same shared family instead of each rebuilding the row.
  - The like/dislike pair stays mutually exclusive and re-clicking clears it, matching the RD `toggleVideoHistoryReaction` reducer, and the `-active`/`-default` icon variants are driven by that state.
  - RD keeps the reaction in a central store keyed by result id so the History card and the detail dialog agree; Redux is outside the platform-UI boundary, so the component owns an equivalent module-level store with the same keying. It is prototype-only state that is never persisted or transmitted.
  - The default download keeps RD's anchor step against the already-loaded local asset and drops the production fetch, auth and analytics services; a consumer-supplied `download` handler always wins.
  - Edit stays delegated to the consumer because RD implements it as cross-module routing plus history rehydration, which the prototype boundary excludes.
