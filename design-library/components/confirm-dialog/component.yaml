decisionBasis:
  - "Extracted from RD source on 2026-09-15 for Cloud Storage's move-to-trash confirmation, per the shared component workflow: no replacement UI was designed. Three RD files compose it — common/modal for the overlay, components/portal for the mount, and the gallery's own delete-confirm-modal for the dialog body — and they are promoted together because the dialog is meaningless without the overlay's focus handling."
  - "portability is `reference`. RD's dialog hard-codes delete-history copy through `getTranslationFunction()` and routes its buttons through common/message-dialog's ConfirmCancellationButton, which branches over four dialog types and depends on RD's ButtonWrapper plus its hover/touch class maps. Here the copy is props and the button pair is the catalogued `button` component, so adding a second confirmation does not mean adding a fifth branch to a shared file. RD keeps its own implementation."
  - "Portal root (2026-09-15): RD's Portal looks up a pre-existing `#portal-root` element and renders nothing when it is absent, because RD's own document template provides one. A shared component cannot assume the host page does, so the container is created on first use and removed again only if it is still empty. Same mount point, no host requirement."
  - "RD's overlay behaviour is carried unchanged because each piece exists for a reason its own comments record: the double requestAnimationFrame that lets a lazily-mounted dialog play its enter transition at all; the 400ms delayed unmount so the exit transition finishes; the collapse-and-park `.closed` rule rather than unmounting; and the scale transition. A `prefers-reduced-motion` block is added, which RD has no equivalent for."
  - "Escape now closes the dialog (2026-09-15). RD's modal handles the Tab trap itself but leaves Escape to each caller's optional `onKeyDown`, and the gallery's delete dialog passes none — so in production that dialog cannot be dismissed from the keyboard. Since this component owns its own cancel affordance, Escape is wired to it here. This is a behavioural addition, not a port."
  - "The accessible-name gate is RD's: `role='dialog'`, `aria-modal`, focus-on-open, focus-restore-on-close and the Tab trap all switch on only when `ariaLabel` or `ariaLabelledBy` is supplied. This component always supplies `aria-labelledby` pointing at its own title, so every ConfirmDialog is a real dialog — unlike the pricing overlay the surface acceptance flagged for having no dialog role."
  - "Colour mapping (2026-09-15) follows app/src/surfaces/rd-port/token-colour-mapping.json. Exact: `#fff` -> `--fill-white`. Three approximations, carried from that record rather than re-decided: the backdrop `rgb(0 0 0 / 50%)` -> `--fill-overlay-weak` (#00000073), which is 45% rather than 50% so the page behind reads very slightly lighter; the modal's text colour `#212529` -> `--grey-slate-solid-850` (#1d2426); and the cancel link `#575757` -> `--grey-neutral-solid-800` (#333), a noticeably darker grey. All three stay pending Designer definition."
  - "Typography is kept as RD's literals rather than forced onto tokens: 30px title, 16px/22px body, 14px cancel and the 120px pill radius have no matching token, and the raw-colour policy does not cover non-colour values. RD's `font-weight: 500` on the title and body maps to `--font-weight-weak` (400), the same medium-to-regular shift recorded on selection-toolbar."
  - "Layout follows RD's stacked treatment rather than a conventional two-button footer: the confirm is a full-width pill and the cancel is plain text beneath it. On a destructive confirmation that asymmetry is deliberate, so the safe choice is not presented as a competing button."
