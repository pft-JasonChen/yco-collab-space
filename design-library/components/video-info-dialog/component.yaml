decisionBasis:
  - RD common Modal supplies the dark backdrop and focus boundary while video-detail-modal supplies the split media, metadata and Next Action composition.
  - The pure-props pilot does not expose production routing, account, analytics, task or download services.
  - Next Action and reaction affordances use the allowlisted RD img2Vid icon assets; Video Expansion reuses the RD AI Extend glyph pending canonical icon design.
