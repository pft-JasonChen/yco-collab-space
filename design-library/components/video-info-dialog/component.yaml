decisionBasis:
  - RD common Modal supplies the dark backdrop and focus boundary while video-detail-modal supplies the split media, metadata and Next Action composition.
  - The pure-props pilot does not expose production routing, account, analytics, task or download services.
  - Next Action and reaction affordances use the allowlisted RD img2Vid icon assets; Video Expansion reuses the RD AI Extend glyph pending canonical icon design.
  - The Next Action footer composes the shared Icon Action Buttons family, matching how RD's next-action block reuses `video-feature/icon-action-buttons` instead of owning its own like/dislike/download row.
  - "Close icon switched to icon font (2026-09-16, requested live — \"請用昨天和你說的icon font的regular然後字級大小24px\"): the close button's hand-drawn inline `DialogIcon` SVG is replaced with the same YcoInterfaceIcons glyph VideoTrimModal's own close button already uses (icon-ic-x-b-regular, U+E943, 24px, regular weight), via a local @font-face pointing at the same design-library icomoon.woff every other icon-font consumer in this codebase declares per-module. `DialogIcon` (including its unused `video` case) is removed entirely."
  - "Next Action buttons: icons removed, height fixed at 40px, text restyled (2026-09-16, requested live — \"我們有換樣式，把icon都移除，按鈕高度預設兩行，也就是40px\", text spec read from a Figma Dev Mode inspect): each button used to render an icon (`NextActionIcon`, via `action.icon`/`action.iconUrl`) beside a single-line ellipsis-truncated label; the icon is dropped, the label can now wrap onto a second line, and the button's height is a fixed 40px (not a min-height) to hold up to two lines. Text is Font family/Body, 14px, 16px line-height, weight Strong, 0 letter-spacing (14px = `--font-size-tiny`, 16px = `--line-height-micro` — the two don't share a single named pair, since this spec crosses the token system's usual tiny/micro groupings). `NextActionIcon`, and the `ActionIcon`/`actionIcons` imports it alone used, are removed; `IconActionButtons`/`defaultDetailActions` remain for the footer's like/dislike/download row, which is unrelated and unchanged."
  - "`.nextGrid button:disabled` no longer dims text (2026-09-16, requested live — \"為什麼其他顆字都灰灰的\"): was opacity: 0.64 on `:disabled`, which in practice dimmed every option except whichever one happens to have `onSelect` wired by the current consumer (video-expansion only wires its own feature, leaving every other Next Action `disabled` by construction) — a per-prototype implementation detail (which targets exist yet), not a real visual state Figma specifies. Confirmed live: every option's text should read the same dark/Strong regardless of whether a click handler happens to be wired. Still functionally inert (`cursor: default` kept), just no longer visually distinguished by opacity."
  - "Next Action pills and Retry given hover/press feedback (2026-09-16, requested live — \"這幾顆都是按鈕，所以要有hover press效果\"): neither had any interaction feedback at all. `.nextGrid button` (outlined, --background-base fill) takes the same --fill-hover/--fill-press pair SelectionToolbar's own ghost actions use; `.footer .retry` (solid --fill-strong, matches Button.module.css's own tone_neutral.variant_primary) takes that pairing's own --fill-inverse-hover/--fill-inverse-press instead, since a light overlay tint on a dark fill needs the inverse pair, not the plain one. Not excluded for :disabled Next Action options, same reasoning as the entry above this one: onSelect wiring is a per-prototype detail, not a real design state, so every option gets the same feedback."
  - "Retry given flex:1;min-width:0 at <=992px (2026-09-16, requested live — \"這顆不是固定寬度，手機是偵測剩餘空間，稱滿剩餘空間\", against a screenshot showing it overlapping the like/dislike/download icons): its fixed min-width (unchanged for >=992px) doesn't shrink or yield space back to siblings, so at a narrow mobile dialog width the icon row and Retry no longer fit side by side and neither gave way — they overlapped instead of Retry shrinking. flex:1;min-width:0 lets it fill whatever space is actually left after the icon row takes its own natural size."
  - "Auto-sync (2026-09-16): `VideoInfoDialog.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Retry's hover/press fix from the entry two above corrected — was invisible on hover (2026-09-16, requested live — \"Retry hover的時候消失了，你有去看Storybook 黑色按鈕的hover嗎？\"): directly swapping `background` to `--fill-inverse-hover`/`--fill-inverse-press` replaced `--fill-strong` outright instead of tinting it — both tokens are deliberately translucent (~12%/~20% white), meant to composite OVER a solid fill via a separate layer, not stand alone as an opaque background; replacing `--fill-strong` with one turned Retry almost fully transparent against the dialog's white background. Checked Storybook's own Button (Button.module.css, `tone_neutral.variant_primary` — the shared source for this exact dark-fill/light-text combination) for the actual pattern: a separate `::before`, absolutely positioned under the label content (raised via z-index:1) and over the real background, starting transparent and only becoming the tint on hover/active. Copied that structure verbatim rather than re-deriving it — also required wrapping Retry's label in a `<span>` in the .jsx, since `.footer .retry > *` (lifting content above the overlay) had no element to match against bare text, which would have hidden the LABEL the same way once non-transparent."
  - "`.footer` given an explicit gap (2026-09-16, requested live — \"中間還是要有距離啊，你去看一下\", node 3245:619733): `justify-content: space-between` alone only spaces the icon row and Retry apart when there IS leftover width beyond what both need — true while Retry had a fixed min-width, but no longer once it became `flex: 1` (fills whatever space is left, see the entry three above) — Retry's box then started flush against the icon row with zero gap. `gap: var(--spacing-16)` guarantees a floor regardless of how much extra width Retry ends up claiming."
  - "Auto-sync (2026-09-16): `VideoInfoDialog.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Auto-sync (2026-09-16): `VideoInfoDialog.jsx`, `VideoInfoDialog.module.scss` hashes updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
