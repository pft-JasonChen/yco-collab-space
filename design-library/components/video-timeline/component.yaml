decisionBasis:
  - The PO approved promotion of the Video Object Remover feature timeline into the shared pilot for video tool surfaces.
  - Mask-removal markers are excluded from the base public API because Video Expansion only needs playback and seek.
  - Feature surfaces may supply ordered browser-captured frame URLs; capture and media decoding remain feature responsibilities rather than shared timeline behavior.
  - "Trim handles added (2026-09-14, reference jb5SgyshmuPse0L7IFm0QO node 14893:252737/7460:183805): this component previously rendered the filmstrip for only the SELECTED [startTime, endTime] window, with no way to adjust that window from the timeline itself — RD's own Trim Video modal has separate, duplicate trim-handle logic (useTrimDrag.js) that this component didn't share. Per Figma's own frames+Play component (componentPropertyDefinitions: 'Show Keyframe', 'Show trim-range', 'overlay-l', 'overlay-r', 'Devices'), the filmstrip actually spans the FULL clip duration with the selected range drawn as an overlay on top — dimmed outside the range, an outlined box with draggable left/right handles inside it. Rebuilt to match: every percentage in the component is now measured against `duration`, not the selected sub-range; new `onTrimStartChange`/`onTrimEndChange` props fire while a handle is dragged (self-contained pointer-event drag logic in VideoTimeline.jsx, not a port of the modal's own hook, to avoid coupling this shared component to VideoTrimModal's internal state shape). New `showTrimHandles` prop (default true, matching Figma) gates the whole overlay; `minimumSeconds`/`maximumSeconds` constrain how far a handle can drag, mirroring the modal's own trim-window rules. video-expansion's canvas timeline (its one real consumer) now wires onTrimStartChange={setTrimStart}/onTrimEndChange={setTrimEnd} — it already had live trimStart/trimEnd state, so the handles are functional there immediately, not just decorative."
  - "showKeyframe — wrong first, then corrected same session (2026-09-14): the first pass read Figma's 'Show Keyframe' component property as a filmstrip-visibility toggle and implemented it that way (a showKeyframes prop that swapped the whole filmstrip for a blank placeholder). Reported live with a Figma screenshot: it's actually a single diamond marker centered over the filmstrip, used on the video object-removal flow to flag that an edit exists at that point in the clip — the filmstrip itself is unconditional. Corrected: renamed to singular showKeyframe (matching Figma's own singular property name) rendering a centered diamond badge (new assets/icon/yco-video-timeline/keyframe.svg, exported from Figma) when true; the filmstrip-hiding behavior and its framesPlaceholder class were removed entirely, not left as a second, now-meaningless toggle. video-expansion passes showKeyframe={false} explicitly — that marker is specific to the object-removal edit-in-place flow, not video expansion, so showing it there would misleadingly imply an edit exists."
  - "Time label externalized (2026-09-14, same Figma reference): the component's own <time>{current} / {total}</time> element is removed — Figma's layout has the '00:00'/'00:22' pair in its own row above the frames+Play track, not stitched into the same flex container. Consumers now render their own label from the same startTime/currentTime/endTime values they already pass in, via this module's still-exported formatTimelineTime. video-expansion's own index.jsx wires this via a new .derivedTimelineRow/.derivedTimelineTime wrapper."
  - "Playhead height fix (2026-09-14, reported live: \"Playhead 的高度應該要比整個frames高，比較明顯\"): the playhead was exactly flush with the 48px track height, blending into the filmstrip. Figma's own Playhead is 68px against a 56px frame row — taller on both ends, not flush. Matched via `top:-6px; height:calc(100% + 12px)` on .playhead; .track's own `overflow:hidden` (which would have clipped the overshoot straight back off) was removed and pushed one level down onto .frames/.framesPlaceholder instead, which are the only layers that actually need edge clipping."
  - "Storybook Controls not reactive (2026-09-14, reported live — \"為什麼我調control上面數值的時候都沒有跟著動\"): TimelineStory seeds startTime/endTime/currentTime into local useState so dragging a handle can update them interactively, but useState's initial value is only read on mount — a later Controls edit changed the incoming `args` prop, which the render ignored entirely since it always used the (now stale) local state instead. Fixed with a `useEffect` per field re-syncing local state whenever that specific arg changes, so both paths (Controls edits and live handle-dragging) update the same state correctly."
  - "Handle protrusion tried, then reverted; playhead clamped instead of hidden (2026-09-14, iterative): first pass, requested — \"有辦法讓1更左邊2更右邊嗎？...他們是超出frame的存在\" — moved the handles to sit CENTERED on the trim-range boundary (`translateX(-50%)`/`translateX(50%)`) and made them taller/pill-shaped so half of each protrudes past the track edge, with the playhead line skipped entirely whenever within ~1.5% of a handle. Reported live afterward that the playhead should visibly stop just short of the handle rather than disappear (\"playhead頂多只能到這裡而已，就要被卡住，另一邊也一樣\"), and separately asked for the handle style reverted (\"handler的樣式請改回來\"). Final state: `.handle`/`.handleLeft`/`.handleRight` are back to the original flush, track-height, -1.5px-inset design; the playhead is now CLAMPED (not hidden) to stay a small margin (1.5%) short of either handle's position — `playheadLowerBound`/`playheadUpperBound` in VideoTimeline.jsx — so it always stays visible and reads as hitting a wall next to the handle instead of overlapping it or vanishing. Degenerates to the selection's midpoint if the range is too narrow for both margins to fit. That first clamp still visibly overlapped the handle by ~half its width (reported live: \"沒有卡住，超過去一半了\") — root cause: the margin was a PERCENT of the track's own width, but the handle's footprint is a fixed 16px regardless of how wide the track renders, so the percent-based margin converted to fewer pixels than the handle's own size on this track width. Rewritten to clamp in CSS itself via `clamp()`, mixing the boundary percentage with a literal pixel offset (20px — clears the handle's own -1.5px-inset 16px box plus the playhead's own ~3px half-width from its `translateX(-50%)` centering) so it's correct regardless of the track's actual rendered width, not an approximation that only happens to work at one size."
  - "Label row moved back in (2026-09-14, requested — \"我希望你可以把1和2跟在Video Timeline這個元件，只是分別做布林\", pointing at VideoTrimModal's own \"Select 5-30 seconds\" / \"00:30\" labels): the time-label row had just been externalized to consumers (see the entry above) — this reverses that specific part. It's back inside VideoTimeline as two independently toggleable slots (`showLeftLabel`, `showRightLabel`), not one all-or-nothing row, with a new `hintText` prop: when set, the left slot shows that hint in --text-strong instead of a time value; when unset, it falls back to the elapsed-within-selection time in --text-weaker. Matches Figma's own two reference frames (jb5SgyshmuPse0L7IFm0QO node 14893:252737) exactly — \"Max selected length: 10s\" (strong) + \"00:22\" (weaker) in one, \"00:00\" + \"00:22\" (both weaker) in the other — which is what prompted the color-follows-content-type behavior (\"有時候他們是時間，有時候他們是hint 文字顏色也會因此不同\"). `.timeline` restructured from a single flex row into a column (optional `.labelRow`, then `.mainRow` — the pill background/padding that used to live directly on `.timeline` moved to `.mainRow`). video-expansion's own index.jsx dropped its now-redundant `.derivedTimelineRow`/`.derivedTimelineTime` wrapper and just passes `showLeftLabel showRightLabel`. VideoTrimModal's own equivalent UI (trim-timeline.js) is a separate, not-yet-consolidated implementation — left untouched here; flagged as a plausible future follow-up (letting it consume this component's hintText slot instead of duplicating the row) but not done in this pass."
  - "Storybook cleanup (2026-09-14, requested — \"這幾個是不是可以用control切換？\" then \"我分不出來這三個有什麼不同，好像只要留一個就好\"): WithoutTrimHandles/WithoutKeyframes were removed as dedicated stories once showTrimHandles/showKeyframe existed as real boolean Controls — a dedicated story duplicating what a Control already demonstrates is exactly the redundancy this pilot's story-count cleanups (NavigationHeader, UploadMediaBlock) have removed elsewhere. Separately, the remaining SelectedSegment/SynchronizedCanvasPlayback/CapturedFrameInput trio collapsed to one Default story — SynchronizedCanvasPlayback only toggled the invisible `data-synchronized` attribute, and CapturedFrameInput repeated the same poster image across every frameUrls slot, rendering pixel-identical to the posterUrl fallback the default story already shows; neither was a visually distinct state worth its own story. Also added explicit argTypes/table:{disable:true} for every prop react-docgen couldn't infer a real type for on this plain-JS component (was showing raw \"unknown\"/\"Set object\" for nearly everything)."
  - "thumbnailCount and synchronized removed entirely (2026-09-14, requested — \"這固定式10不用設定\" and, after confirming it had zero consumers, \"這如果沒作用要不要拿掉\"): thumbnailCount was a prop for a value that never actually varies — Figma's own filmstrip (node 14893:252737, 7460:183805) is always exactly 10 thumbnails — so it's now a local `THUMBNAIL_COUNT = 10` constant, not a prop. `synchronized`/`data-synchronized` only ever set a data attribute with zero consumers anywhere (no CSS selector, no test) once the story that used to demonstrate it was removed in the cleanup above; removed rather than left as dead prop surface. video-expansion's own `<VideoTimeline>` call no longer passes either."
  - "Handle widened, then corrected to the actual Figma geometry (2026-09-14): reported live — \"我希望handler最底的位置應該是這兩畫紅色的地方（超出frame範圍\" — first fix widened `.handle` from 16px to `calc(var(--spacing-12) + 16px)` (28px), reaching .mainRow's own edge but guessing at the mechanism. Corrected once given the actual reference nodes (jb5SgyshmuPse0L7IFm0QO 14908:253051 and 11469:164246 — \"不是要你改變寬度，你參考figma位置\"): per both frames' own node geometry, the handle itself stays a plain 16px (back to that width, not widened) — what actually extends past the true time boundary is the BORDERED .trimRange box itself, by exactly one handle-width (16px) on each side, with each handle simply sitting flush at that box's own edge (`left:0`/`right:0`). Implemented via the inline `left`/`width` style on .trimRange in VideoTimeline.jsx: `calc(${startPercent}% - 16px)` / `calc(${selected}% + 32px)` — the dimmed overlay (.overlayDim) is unaffected, still drawn at the true startPercent/endPercent so the SELECTED-vs-dimmed distinction still reflects the real trim window; only the bordered box (and the handles riding on its two ends) extends further out. Confirmed via getBoundingClientRect that the handle's inner edge now lines up with the true boundary to within ~1.5px (the trim-range border's own thickness). The playhead-vs-handle clearance (previous entry) shrank from 20px to 5px accordingly — the handle's footprint no longer overlaps the selected range's own [startPercent, endPercent] span at all, so a large margin was never actually doing separation work; 5px is just enough for a visible gap at the exact extremes."
