decisionBasis:
  - The PO approved promotion of the Video Object Remover feature timeline into the shared pilot for video tool surfaces.
  - Mask-removal markers are excluded from the base public API because Video Expansion only needs playback and seek.
  - Feature surfaces may supply ordered browser-captured frame URLs; capture and media decoding remain feature responsibilities rather than shared timeline behavior.
  - "Trim handles added (2026-09-14, reference jb5SgyshmuPse0L7IFm0QO node 14893:252737/7460:183805): this component previously rendered the filmstrip for only the SELECTED [startTime, endTime] window, with no way to adjust that window from the timeline itself — RD's own Trim Video modal has separate, duplicate trim-handle logic (useTrimDrag.js) that this component didn't share. Per Figma's own frames+Play component (componentPropertyDefinitions: 'Show Keyframe', 'Show trim-range', 'overlay-l', 'overlay-r', 'Devices'), the filmstrip actually spans the FULL clip duration with the selected range drawn as an overlay on top — dimmed outside the range, an outlined box with draggable left/right handles inside it. Rebuilt to match: every percentage in the component is now measured against `duration`, not the selected sub-range; new `onTrimStartChange`/`onTrimEndChange` props fire while a handle is dragged (self-contained pointer-event drag logic in VideoTimeline.jsx, not a port of the modal's own hook, to avoid coupling this shared component to VideoTrimModal's internal state shape). New `showTrimHandles` prop (default true, matching Figma) gates the whole overlay; `minimumSeconds`/`maximumSeconds` constrain how far a handle can drag, mirroring the modal's own trim-window rules. video-expansion's canvas timeline (its one real consumer) now wires onTrimStartChange={setTrimStart}/onTrimEndChange={setTrimEnd} — it already had live trimStart/trimEnd state, so the handles are functional there immediately, not just decorative."
  - "showKeyframe — wrong first, then corrected same session (2026-09-14): the first pass read Figma's 'Show Keyframe' component property as a filmstrip-visibility toggle and implemented it that way (a showKeyframes prop that swapped the whole filmstrip for a blank placeholder). Reported live with a Figma screenshot: it's actually a single diamond marker centered over the filmstrip, used on the video object-removal flow to flag that an edit exists at that point in the clip — the filmstrip itself is unconditional. Corrected: renamed to singular showKeyframe (matching Figma's own singular property name) rendering a centered diamond badge (new assets/icon/yco-video-timeline/keyframe.svg, exported from Figma) when true; the filmstrip-hiding behavior and its framesPlaceholder class were removed entirely, not left as a second, now-meaningless toggle. video-expansion passes showKeyframe={false} explicitly — that marker is specific to the object-removal edit-in-place flow, not video expansion, so showing it there would misleadingly imply an edit exists."
  - "Time label externalized (2026-09-14, same Figma reference): the component's own <time>{current} / {total}</time> element is removed — Figma's layout has the '00:00'/'00:22' pair in its own row above the frames+Play track, not stitched into the same flex container. Consumers now render their own label from the same startTime/currentTime/endTime values they already pass in, via this module's still-exported formatTimelineTime. video-expansion's own index.jsx wires this via a new .derivedTimelineRow/.derivedTimelineTime wrapper."
  - "Playhead height fix (2026-09-14, reported live: \"Playhead 的高度應該要比整個frames高，比較明顯\"): the playhead was exactly flush with the 48px track height, blending into the filmstrip. Figma's own Playhead is 68px against a 56px frame row — taller on both ends, not flush. Matched via top: -6px; height: calc(100% + 12px) on .playhead; .track's own `overflow: hidden` (which would have clipped the overshoot straight back off) was removed and pushed one level down onto .frames/.framesPlaceholder instead, which are the only layers that actually need edge clipping."
  - "Storybook Controls not reactive (2026-09-14, reported live — \"為什麼我調control上面數值的時候都沒有跟著動\"): TimelineStory seeds startTime/endTime/currentTime into local useState so dragging a handle can update them interactively, but useState's initial value is only read on mount — a later Controls edit changed the incoming `args` prop, which the render ignored entirely since it always used the (now stale) local state instead. Fixed with a `useEffect` per field re-syncing local state whenever that specific arg changes, so both paths (Controls edits and live handle-dragging) update the same state correctly."
  - "Handle protrusion tried, then reverted; playhead clamped instead of hidden (2026-09-14, iterative): first pass, requested — \"有辦法讓1更左邊2更右邊嗎？...他們是超出frame的存在\" — moved the handles to sit CENTERED on the trim-range boundary (`translateX(-50%)`/`translateX(50%)`) and made them taller/pill-shaped so half of each protrudes past the track edge, with the playhead line skipped entirely whenever within ~1.5% of a handle. Reported live afterward that the playhead should visibly stop just short of the handle rather than disappear (\"playhead頂多只能到這裡而已，就要被卡住，另一邊也一樣\"), and separately asked for the handle style reverted (\"handler的樣式請改回來\"). Final state: `.handle`/`.handleLeft`/`.handleRight` are back to the original flush, track-height, -1.5px-inset design; the playhead is now CLAMPED (not hidden) to stay a small margin (1.5%) short of either handle's position — `playheadLowerBound`/`playheadUpperBound` in VideoTimeline.jsx — so it always stays visible and reads as hitting a wall next to the handle instead of overlapping it or vanishing. Degenerates to the selection's midpoint if the range is too narrow for both margins to fit. That first clamp still visibly overlapped the handle by ~half its width (reported live: \"沒有卡住，超過去一半了\") — root cause: the margin was a PERCENT of the track's own width, but the handle's footprint is a fixed 16px regardless of how wide the track renders, so the percent-based margin converted to fewer pixels than the handle's own size on this track width. Rewritten to clamp in CSS itself via `clamp()`, mixing the boundary percentage with a literal pixel offset (20px — clears the handle's own -1.5px-inset 16px box plus the playhead's own ~3px half-width from its `translateX(-50%)` centering) so it's correct regardless of the track's actual rendered width, not an approximation that only happens to work at one size."
  - "Label row moved back in (2026-09-14, requested — \"我希望你可以把1和2跟在Video Timeline這個元件，只是分別做布林\", pointing at VideoTrimModal's own \"Select 5-30 seconds\" / \"00:30\" labels): the time-label row had just been externalized to consumers (see the entry above) — this reverses that specific part. It's back inside VideoTimeline as two independently toggleable slots (`showLeftLabel`, `showRightLabel`), not one all-or-nothing row, with a new `hintText` prop: when set, the left slot shows that hint in --text-strong instead of a time value; when unset, it falls back to the elapsed-within-selection time in --text-weaker. Matches Figma's own two reference frames (jb5SgyshmuPse0L7IFm0QO node 14893:252737) exactly — \"Max selected length: 10s\" (strong) + \"00:22\" (weaker) in one, \"00:00\" + \"00:22\" (both weaker) in the other — which is what prompted the color-follows-content-type behavior (\"有時候他們是時間，有時候他們是hint 文字顏色也會因此不同\"). `.timeline` restructured from a single flex row into a column (optional `.labelRow`, then `.mainRow` — the pill background/padding that used to live directly on `.timeline` moved to `.mainRow`). video-expansion's own index.jsx dropped its now-redundant `.derivedTimelineRow`/`.derivedTimelineTime` wrapper and just passes `showLeftLabel showRightLabel`. VideoTrimModal's own equivalent UI (trim-timeline.js) is a separate, not-yet-consolidated implementation — left untouched here; flagged as a plausible future follow-up (letting it consume this component's hintText slot instead of duplicating the row) but not done in this pass."
  - "Storybook cleanup (2026-09-14, requested — \"這幾個是不是可以用control切換？\" then \"我分不出來這三個有什麼不同，好像只要留一個就好\"): WithoutTrimHandles/WithoutKeyframes were removed as dedicated stories once showTrimHandles/showKeyframe existed as real boolean Controls — a dedicated story duplicating what a Control already demonstrates is exactly the redundancy this pilot's story-count cleanups (NavigationHeader, UploadMediaBlock) have removed elsewhere. Separately, the remaining SelectedSegment/SynchronizedCanvasPlayback/CapturedFrameInput trio collapsed to one Default story — SynchronizedCanvasPlayback only toggled the invisible `data-synchronized` attribute, and CapturedFrameInput repeated the same poster image across every frameUrls slot, rendering pixel-identical to the posterUrl fallback the default story already shows; neither was a visually distinct state worth its own story. Also added explicit argTypes/table:{disable:true} for every prop react-docgen couldn't infer a real type for on this plain-JS component (was showing raw \"unknown\"/\"Set object\" for nearly everything)."
  - "thumbnailCount and synchronized removed entirely (2026-09-14, requested — \"這固定式10不用設定\" and, after confirming it had zero consumers, \"這如果沒作用要不要拿掉\"): thumbnailCount was a prop for a value that never actually varies — Figma's own filmstrip (node 14893:252737, 7460:183805) is always exactly 10 thumbnails — so it's now a local `THUMBNAIL_COUNT = 10` constant, not a prop. `synchronized`/`data-synchronized` only ever set a data attribute with zero consumers anywhere (no CSS selector, no test) once the story that used to demonstrate it was removed in the cleanup above; removed rather than left as dead prop surface. video-expansion's own `<VideoTimeline>` call no longer passes either."
  - "Handle widened, then corrected to the actual Figma geometry (2026-09-14): reported live — \"我希望handler最底的位置應該是這兩畫紅色的地方（超出frame範圍\" — first fix widened `.handle` from 16px to `calc(var(--spacing-12) + 16px)` (28px), reaching .mainRow's own edge but guessing at the mechanism. Corrected once given the actual reference nodes (jb5SgyshmuPse0L7IFm0QO 14908:253051 and 11469:164246 — \"不是要你改變寬度，你參考figma位置\"): per both frames' own node geometry, the handle itself stays a plain 16px (back to that width, not widened) — what actually extends past the true time boundary is the BORDERED .trimRange box itself, by exactly one handle-width (16px) on each side, with each handle simply sitting flush at that box's own edge (`left:0`/`right:0`). Implemented via the inline `left`/`width` style on .trimRange in VideoTimeline.jsx: `calc(${startPercent}% - 16px)` / `calc(${selected}% + 32px)` — the dimmed overlay (.overlayDim) is unaffected, still drawn at the true startPercent/endPercent so the SELECTED-vs-dimmed distinction still reflects the real trim window; only the bordered box (and the handles riding on its two ends) extends further out. Confirmed via getBoundingClientRect that the handle's inner edge now lines up with the true boundary to within ~1.5px (the trim-range border's own thickness). The playhead-vs-handle clearance (previous entry) shrank from 20px to 5px accordingly — the handle's footprint no longer overlaps the selected range's own [startPercent, endPercent] span at all, so a large margin was never actually doing separation work; 5px is just enough for a visible gap at the exact extremes."
  - "`.mainRow` right padding widened to 28px (2026-09-15, reported live via a Figma Dev Mode inspect of this same frame — \"灰底右邊的padding應該改成28px，不然右邊的handler會超出去\"): with the trim-range box extending 16px past the track's own right edge (previous entry), the plain 12px used on `.mainRow`'s other three sides left the right handle overhanging past the pill's own background by ~4px. 28px is the spec value from that Dev Mode inspect (`4px 28px 4px 12px`); no matching token exists at 28px (nearest are --spacing-24/--spacing-32) so it's a literal px like `.handle`/`.playhead`'s own geometry, not one of the spacing-scale tokens. Left/top/bottom padding unchanged at 12px/4px/4px — only the right side needed the extra room."
  - "Shared directly with VideoTrimModal instead of staying a second, parallel implementation (2026-09-15, requested live — \"左邊的調好應該可以直接當右邊那組的元件，所以兩邊應該長一樣的\" — confirmed via explicit choice between 'fix the padding fix in both places separately' and 'share the component outright'; user picked full sharing): VideoTrimModal previously carried its own from-scratch filmstrip/handles/playhead implementation (kept deliberately as a verbatim port of RD's own trim-timeline.js, per that component's own decisionBasis), which had the identical right-edge overhang bug as this component did before the padding fix above — two copies of the same geometry, drifting independently. VideoTrimModal.jsx now renders this component directly for that row instead. Two new escape-hatch props added to support its one real difference — it draws actual decoded video frames onto per-slot `<canvas>` elements (via its own useFrameThumbnails hook) rather than static frameUrls/posterUrl `<img>` sources: `renderFrame(index)` lets a consumer supply arbitrary per-slot content instead of the default `<img>`/`<span>`, and `onFrameAreaResize(width)` reports the `.frames` row's own measured pixel width (via a ResizeObserver on the same ref already used for track geometry) so a renderFrame consumer can size that content correctly without a second, duplicate ResizeObserver. Everything else VideoTrimModal needs — the track, dimmed overlay, trim-range box, draggable handles (including the maximum-window clamp math), and the playhead — was already generic enough to reuse as-is; VideoTrimModal's own useTrimDrag.js (a second, delta-based implementation of the same handle-drag and track-seek math this component already had, absolute-position-based) is now dead and was deleted rather than left unused. Two testids were added directly on the handles (`canvas-trim-handle-start`/`canvas-trim-handle-end`, matching this component's existing `canvas-playback-*` naming) since VideoTrimModal's own Playwright checks needed to find them post-merge; its two former testids for the same elements (`trim-handle-start`/`trim-handle-end`) no longer exist. One consumer-visible behavior did NOT carry over: VideoTrimModal used to pause video playback for the duration of a playhead drag and resume it after release (via its own stop/resume hook wiring); this component's own seek path is a native `<input type=range>` with no equivalent hook point, so that specific pause-while-scrubbing nicety is gone. Not covered by any existing check, judged an acceptable trade-off for one shared implementation over two drifting ones."
  - "maximumSeconds dropped; handle drag no longer clamps to a maximum (2026-09-15, corrected live — \"handler應該要讓user隨意拉動，而不是根據時間限制鎖死，如果影片是有限制時長的話，user調整範圍若超出hint就會變成紅色的字\"): the maximumSeconds-based hard clamp added in the trim-handles entry above (\"minimumSeconds/maximumSeconds constrain how far a handle can drag, mirroring the modal's own trim-window rules\") turned out to be based on a wrong assumption about what those rules actually were. RD's own baseline drag math (use-trim-drag.js) clamps a handle ONLY by the other handle's position (so the segment can't collapse below the minimum length) and the track's own [0, duration] bounds — never by a maximum length at all; a maximum is enforced by the consumer's own hint text turning to an error color once the selection exceeds it (VideoTrimModal's tooLong/errorLabel, itself matching RD's isTrimRangeTooLong) and by disabling confirm, not by making the handle un-draggable. startHandleDrag's onMove now matches that exactly: `side === 'start'` clamps to `[0, safeEnd - minimumSeconds]`, `side === 'end'` clamps to `[startTime + minimumSeconds, trackDuration]` — no `window`/`maximumSeconds` term anywhere in the math. Since VideoTimeline's own handle-drag was the only place `maximumSeconds` did anything, it's now a fully dead prop and was removed from the public API rather than left as a no-op; VideoTrimModal (its one caller that ever passed it) stopped passing it to <VideoTimeline> while keeping the prop for its own separate tooLong computation in its meta row. The design-library Playwright check that had asserted the old (incorrect) hard-lock behavior — ui-video-trim-modal--maximum-window-clamp — was rewritten to assert the corrected one instead: dragging past the limit grows the duration reading past the maximum and disables confirm, rather than pinning the duration at exactly the maximum."
  - "Play/pause icon swapped from an SVG asset pair to the shared icon font (2026-09-15, tried live — \"1和2的icon有點問題，3我不確定，但是都改成icon font看看\", where \"3\" is this component's own .playButton): was `<img src={isPlaying ? pauseIcon : playIcon}>` against play.svg/pause.svg (design-library/assets/icon/yco-video-timeline/, fill #03ade2). Swapped to the same YcoInterfaceIcons icon font ResultPageShell/ToolFamilyMenu already use for their own glyphs — icon-ic-pause-bold (U+E97B) / icon-ic-play-f (U+E97F), embedded as a JS unicode escape in a `<span>` rather than an `<img>`, colored via --icon-brand (the token #03ade2 itself resolves to) instead of a baked-in SVG fill. A local @font-face (pointing at the same design-library icomoon.woff) was added to this component's own module.scss, following the same per-module-declaration convention ResultPageShell.module.scss already uses rather than sharing one global declaration. Flagged by the user as tried/experimental for this specific button (marked \"3\", vs. explicitly wanted for the two VideoTrimModal buttons marked \"1\"/\"2\") — the play.svg/pause.svg asset files themselves were left in place, not deleted, pending confirmation this direction is the one to keep."
  - "Fixed testid data-testid props to be overridable, correcting a real regression the sharing-with-VideoTrimModal change (previous entry) introduced (2026-09-15, found via GitHub Actions' check-runs — user asked \"這裏為什麼不會顯示\" about a red ✗ on the latest commit): video-expansion's real feature page mounts TWO VideoTimeline instances at once whenever the trim dialog is open — its own persistent canvas timeline (always in the DOM while a video is loaded) plus VideoTrimModal's own instance for the dialog itself — so the hardcoded `canvas-trim-handle-start`/`canvas-playback-toggle`/etc. testids the previous entry gave both instances collided, and Playwright's `getByTestId('canvas-trim-handle-start')` in the feature's own product/validation.yaml resolved to 2 elements instead of 1 (strict-mode violation), failing CI's test:rendered -- --feature video-expansion job. Fixed by adding four optional testid-override props — `playbackTimelineTestId`/`playbackToggleTestId`/`trimHandleStartTestId`/`trimHandleEndTestId` — each defaulting to this component's existing `canvas-*` names (so the primary canvas-timeline consumer and this component's own Storybook stories are unaffected), letting VideoTrimModal supply distinct `trim-*` ids for its own instance instead. Confirmed via a real before/after diff against the commit prior to the original merge (git worktree at the parent commit) that every OTHER rendered-check failure already existed before this session's work and is unrelated pre-existing drift, not something to fix here."
  - "toPercent's basis (previously always `duration`, the full source clip) made conditional on `showTrimHandles` (2026-09-15, found live — after video-expansion's canvas timeline stopped passing showTrimHandles, it reported \"拉到底才會是0:30但拉到一半就卡住了\"): the \"filmstrip spans the FULL clip, percentages measured against duration not selectedDuration\" design (see the 2026-09-14 trim-handles entry above) only makes visual sense while handles/the dimmed-range overlay are actually drawn, since together they explain why the playhead stops short of the track's right edge — it's clamped to the selected range's own boundary, itself drawn at that same percentage. video-expansion's own derived timeline passes an untrimmed source `duration` (e.g. 42s) alongside a separately selected `[startTime, endTime]` window (e.g. 0-30s); with showTrimHandles now false there, nothing is drawn at that boundary to explain the stop anymore, so the playhead just looked stuck partway. Fixed: when showTrimHandles is false, `trackDuration` becomes `selectedDuration` and percentages are taken relative to `startTime`, treating the selected window as the whole timeline (matching the design's original video-frame-source concept no longer applying without handles). No change for any showTrimHandles=true consumer (VideoTrimModal, this component's own Storybook stories) — percentBasisStart is 0 in that case, identical to before."
  - "`.mainRow`'s stray min-height: 72px removed (2026-09-15, reported live with a Figma inspect — \"為什麼上下有留白，沒有撐滿\"): nothing in this row actually needs more than 48px — .playButton and .track are both a plain 48px — so align-items:center was centering them inside 72px of cross-axis room for no reason, leaving a visible gap above and below the frames row instead of the row filling to its own height. This row's height now comes from its 48px children plus its own 4px top/bottom padding, with nothing forcing it taller. Affects both consumers (video-expansion's derived timeline and VideoTrimModal's dialog) identically, verified in both."
  - "`.mainRow`'s own 28px right padding (added for the right handle's overhang) now conditional on `showTrimHandles` via a new `.mainRowNoHandles` modifier — plain 12px, matching the other three sides, when handles are off (2026-09-15, requested live — \"沒有handler的時候，右邊的padding想要縮回12px\"): with showTrimHandles false, neither .trimRange nor the handles it carries render, so nothing needs the extra room anymore. VideoTrimModal (showTrimHandles always true) is unaffected — still 28px."
  - "New pan interaction: dragging inside the trim range but not on a handle now shifts both onTrimStartChange/onTrimEndChange together by the same delta, preserving the selected duration, clamped to the track's own [0, trackDuration] bounds (2026-09-15, requested live — \"我如果是選在兩個handler中間，但不是選中playhead的情況下，應該要整個選取區段可以左右平移\"): previously that middle area had no hit target of its own and fell through to the native seek `<input>`, jumping the playhead there instead. New `startRangePan` mirrors `startHandleDrag`'s own pointer-capture pattern (same track-rect/pxPerSecond math), and a new `.trimRangeMiddle` div (z-index 3, between .handle's 4 and .playhead's 3) fills the space between the two 16px handles as its hit target — only rendered when BOTH onTrimStartChange and onTrimEndChange are given, since panning always needs to set both ends at once. Verified with a real mouse drag (synthetic PointerEvents don't trigger a real setPointerCapture session, so this needed the Browser pane's own drag tool, not a JS-dispatched one) — shrank the selection via the right handle first to create slack, then dragged the middle: both ends moved by the same ~10s delta, width unchanged."
  - "Responsive sizing corrected against Figma's own two device variants, not one shared guess (2026-09-16, requested live — \"手機版和桌機的大小不太一樣，你比較看看\", against jb5SgyshmuPse0L7IFm0QO node 7460:183805's Devices=dt/Devices=mb): `.track`'s frame-row height was a flat 48px at every width, but the two variants actually read 56px (dt) and 40px (mb) — two different values that happened to average out close to 48, not one true value this component had right. Corrected to --spacing-56 by default with a --spacing-40 override under the existing 768px mobile breakpoint; `.playGlyph`'s icon size (24px dt / 20px mb) and `.playhead`'s own overshoot (68px against the 56px dt row = +12px/6px-per-side; 54px against the 40px mb row = +14px/7px-per-side, a different split, not the same delta at a smaller scale) get matching mobile overrides in the same block. Separately, `.mainRow`'s gap (play button to frames) was --spacing-12 (12px) at every width — both Figma variants read 20px there, so unlike the sizes above this one wasn't a device difference, just wrong everywhere; corrected to --spacing-20 with no breakpoint needed. Verified against both variants exactly: track/icon/playhead all match to the pixel at >768px and <=768px."
