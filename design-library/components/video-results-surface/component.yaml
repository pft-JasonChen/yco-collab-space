decisionBasis:
  - RD composes Edit and History tabs, FilterDropdown and HistoryVideos as one results surface; keeping those siblings in one shared component prevents feature-level geometry drift.
  - Desktop tabs retain the intrinsic 368px two-tab BLACK_VIDEO_RESULT width instead of expanding to fill the result toolbar.
  - "Round 2 fix (2026-09-11): .tabs' background used --fill-weaker (a wrong token, PM-reported) instead of --fill-weak — corrected. Also fixed a real CSS specificity bug, not a token typo: the Video Expansion feature's own `.page button, .page input { font: inherit }` reset had accidentally been beating .tab/.activeTab's own font-weight (600) regardless of source order, because `.page button` ((0,1,1) specificity) outranks a plain class selector ((0,1,0)) — the tabs rendered visually regular instead of bold. Fixed on the feature's side (features/video-expansion/generated/index.module.scss now wraps that reset in `:where()` on both sides to zero its specificity), not here; noted here since this component's own rendered output was the visible symptom."
  - "New optional `title` prop (2026-09-14, from real production mobile screenshots): rendered as a heading directly under the tab bar, visible only at <=900px (matching the exact width ToolPageLayout's own @media(max-width:900px){.layout{flex-direction:column}} switches at, not this file's separate pre-existing 992px breakpoint). At >=900px ToolPageLayout keeps the settings panel beside this surface and the feature's own page title already lives in ResultPageShell's header, so repeating it here would duplicate it; below that, ToolPageLayout stacks panel below this surface with the settings form no longer beside a header carrying the title, so this is the one place matching the reference's 'tabs, then title, then form' order without requiring a bigger restructure of ToolPageLayout itself (which stays untouched — Video Expansion also reorders panel-after-result at that same breakpoint via plain CSS `order` on ToolPageLayout's own stable data-surface-zone attributes, entirely from its own feature-level stylesheet)."
  - "mobileTitle font-size fix (2026-09-14, reported): was --font-size-heading-4/--line-height-heading-4 — corrected to --font-size-small/--line-height-small. font-weight-strong was left as-is; only the size/line-height pair was wrong, not the weight."
  - "New stable hook (2026-09-14): the edit/history content div now also carries data-component-role='results-content', so a consumer can turn it into a flex container from the outside. Needed for Video Expansion's empty-state card to actually fill the viewport height (reported live, then diagnosed): a flex item's grown size (this div, via its own flex:1) isn't a 'definite' height for a plain block child's percentage height — confirmed empirically that display:flex on the parent alone wasn't enough either; the child also needs its own explicit flex:1 rather than relying on height:100% to resolve as a flex-basis substitute. Not made flex by default in this file itself, since most existing consumers don't need it and it could shift assumptions app-wide."
  - "`.editContent` given `overflow: hidden`, matching its own `.historyContent` sibling (2026-09-16, requested live — \"這裡應該要偵測剩下的螢幕空間有多少然後撐滿它，而不是scroll\"): without it, whenever a consumer's canvas card (inside editContent) had content taller than the space actually available (e.g. video-expansion's empty state with its icon showing), the excess didn't clip at the card — it escaped upward past this flex item's own box, which stays at its flex-resolved size regardless (`overflow: visible` doesn't grow a flex item to fit an overflowing child, it just stops clipping it), and kept inflating every ancestor up to ResultPageShell's own scrollable `main`, which then scrolled the whole page instead of the card adapting to whatever height it actually had. See tool-page-layout's own component.yaml for the matching fix one level up (`.result`/`.layout`)."
  - "New optional `titleAction` prop (2026-09-16, requested live — \"手機版上傳後...都是上傳後feature name右邊新增一顆upload button\", against a real production mobile screenshot): an action slot rendered next to `title` inside the same `.mobileTitleRow` (so it only ever shows where the title itself does, <=900px), sitting in a new wrapper row rather than inside the `<h2>` — the row is what carries the mobile-only display toggle now, `.mobileTitle` itself is just the text. Left as a generic node (not e.g. an `onUpload` callback) so this component stays feature-agnostic; the consumer decides what it does and when it renders. Video Expansion passes a small circular upload-icon button, shown only once loaded, and hides its own settings-panel upload block on mobile at the same time (own component.yaml) so the two don't duplicate."
  - "Auto-sync (2026-09-16): `VideoResultsSurface.jsx`, `VideoResultsSurface.module.scss` hashes updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "`.mobileTitleRow`'s breakpoint moved from 900px to 767px, matching ToolPageLayout's own corrected stacking breakpoint (2026-09-16, requested live on ToolPageLayout directly — \"我發現你w900就把panel隱藏了 但我們的規則是769~991 panel是 w300, 992以上 panel是 w400, 768以下才是變成手機版\" — see that component's own component.yaml for the full breakpoint correction): this row exists specifically to stand in for ToolPageLayout's stacked page, so it has to switch at the exact same width that component actually stacks at, not its own separate guess. Still intentionally distinct from this file's own pre-existing 992px breakpoint (unrelated — that one is this surface's own toolbar/tabs responsive behavior, untouched)."
  - "Stacking breakpoint corrected again, 767px to 768px (2026-09-16, requested live against a real DevTools responsive-mode screenshot at width 768 — \"768就已經是手機版了，769才是桌機的最小\"; see tool-page-layout's own component.yaml for the full correction): `.mobileTitleRow`'s breakpoint moved to `max-width:768px` in the same pass, still matching ToolPageLayout's own stacking breakpoint exactly."
  - "New `.toolbar` mobile rule — `position: sticky; top: 0` (2026-09-16, requested live — \"這裏也要fixed\", against the Edit/History tab bar): this is the first element in ResultPageShell's own scrolling container once panel and result stack into one page, with real content below it to scroll past — exactly the case sticky is for, unlike the Generate footer (last in flow, needed position:fixed instead, see tool-page-layout's own component.yaml). Needed a matching fix one level up too: ToolPageLayout's own `.result` class had overflow:hidden (unconditional, for the desktop/tablet case) which made it an unintended nearer sticky-positioning ancestor than `.shellContent` — confirmed live (a naive sticky toolbar just scrolled away, measured well above the viewport). Given its own opaque `--background-alternate` background so content scrolling underneath doesn't show through once stuck."
  - "Auto-sync (2026-09-16): `VideoResultsSurface.jsx`, `VideoResultsSurface.module.scss` hashes updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "`.filter` centered instead of right-aligned at true mobile width (2026-09-16, requested live — \"手機版的dropdown 是置中\", node 3319:48930): the existing `align-self: flex-end` (992px rule) was written for the wider 769-991px tablet range that same `.toolbar{flex-direction:column}` stack also covers — mobile wants centered, not a smaller version of tablet's own right-aligned layout. New `@media(max-width:768px)` rule sets `align-self: center` on `.filter`, and re-anchors `.filter ul` (left:50%;transform:translateX(-50%) instead of the base rule's right:0) so the dropdown list stays centered under its now-centered trigger instead of hanging off to one side."
  - "Auto-sync (2026-09-16): `VideoResultsSurface.jsx`, `VideoResultsSurface.module.scss` hashes updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Mobile `.filter` centering corrected — full-width dropdown, not just a centered narrow trigger (2026-09-16, requested live — \"dropdown menu你沒看我給你的截圖嗎，寬度要滿版扣掉padding\", after the entry directly above): `align-self: center` only centers a flex item at its OWN content width — since `.filter` itself is just the ~68px trigger button's own box, that gave the dropdown list underneath it that same narrow ~68px box to anchor against no matter how the list itself was positioned. `.toolbar`'s own `align-items: stretch` (992px rule) is what `.tabs` already relies on for full width, but the SAME 992px block also sets `.filter`'s own `align-self: flex-end` — explicitly reset to `stretch` here so `.filter` actually stretches to that same full content width, with `justify-content: center` then centering the trigger BUTTON within it, and `.filter ul` spanning `.filter`'s own now-full width directly."
  - "Auto-sync (2026-09-16): `VideoResultsSurface.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
  - "Auto-sync (2026-09-16): `VideoResultsSurface.module.scss` hash updated — no documented public prop or decisionBasis-quoted value appears to have changed, so this synced automatically. Review if this doesn't look right."
