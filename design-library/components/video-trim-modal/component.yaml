decisionBasis:
  - AI Agent supplies the closest existing trim behavior and presentation in the RD snapshot.
  - The port keeps local media processing only and does not import production task or account behavior.
  - "SUPERSEDED (2026-09-15, see the entry below dated the same day): this bullet originally read \"The maximum trim window is enforced during handle dragging rather than only at confirm time, so a segment longer than the feature limit can never be selected.\" That was itself a deviation from RD's own baseline (use-trim-drag.js never clamps to a maximum during drag, only to the minimum segment length) introduced when this component's own useTrimDrag.js was first written, and it carried forward unexamined into VideoTimeline's own trim-handle drag logic when the two were unified. Corrected live — \"handler應該要讓user隨意拉動，而不是根據時間限制鎖死，如果影片是有限制時長的話，user調整範圍若超出hint就會變成紅色的字\" — a handle now drags freely up to the minimum-segment and track-bounds limits only; exceeding the maximum is communicated by the hint text turning to an error color and confirm being disabled, matching RD's actual isTrimRangeTooLong behavior. Left in place rather than deleted so the history of the deviation stays visible."
  - "Modal shadow color fix (2026-09-14, reported live — \"這影子顏色不太對\"): .modal's box-shadow used var(--background-overlay) as its color, which resolves to --grey-solid-0 (solid white, the same value as --background-base/--fill-white) — a white shadow renders as no visible shadow at all against the page. No dedicated shadow token exists in this token set; every other elevated surface in platform/ui composes a shadow color from --fill-strong via color-mix instead (VideoResultsSurface's card/drag-handle shadows, CreditControls' action-bar shadow) — same convention applied here (color-mix(in srgb, var(--fill-strong) 16%, transparent)) rather than inventing a new approach. Chose 16% as a middle value between the 10% used for a subtle card shadow and 24% used for a more prominent element elsewhere in platform/ui, since a modal warrants a visible-but-not-heavy lift off its own dim backdrop; no Figma shadow spec was available to match exactly."
  - "Preview letterbox color fix (2026-09-14, reported live — \"這後面我們壓的不是黑色，是fill-weak的顏色\"): .preview's background was var(--background-inverse) (solid near-black), showing as black pillarbox/letterbox bars behind the contain-fitted video preview. Corrected to var(--fill-weak) (light grey), matching the intended design."
  - "Filmstrip/handles/playhead now shared with platform/ui/video-timeline instead of a second, parallel implementation (2026-09-15, requested live — \"左邊的調好應該可以直接當右邊那組的元件，所以兩邊應該長一樣的\", after the Video Timeline story's own `.mainRow` right-padding overflow fix — 28px, see that component's decisionBasis — turned out not to be visible here because this modal had its own from-scratch copy of the same layout with the same bug, independently): this changes `rd.portability` from `verbatim` to `reference` and drops the `constants.js` `verbatimFiles` byte-parity pledge — RD's own trim-timeline.js in the snapshot is untouched and still what RD would actually consume, but `platform/ui/video-trim-modal/constants.js` on our side no longer matches it byte-for-byte (MAX_TRIM_SECONDS/MIN_TRIM_SECONDS/isTrimRangeTooLong/FRAME_INSET/getPxPerSecond/clamp all removed as dead once VideoTimeline's own handle-drag/track-seek math took over; THUMBNAIL_HEIGHT changed from a responsive 56/40px pair to a flat 48px matching VideoTimeline's own fixed-height frame row; getThumbnailWidth's own formula dropped its FRAME_INSET subtraction since VideoTimeline's frames row has no inset padding of its own, unlike the layout it replaced). VideoTrimModal.jsx no longer has its own TrimTimeline geometry — it renders <VideoTimeline> directly, passing real decoded video frames per-slot via VideoTimeline's new `renderFrame`/`onFrameAreaResize` props (see that component's own decisionBasis for exactly what those do and why) instead of duplicating the track/handle/playhead JSX and CSS a second time. `useTrimDrag.js` (this component's own delta-based handle-drag/track-seek hook) is now dead code and was deleted rather than left unused, since VideoTimeline's own absolute-position-based drag logic covers the same job — including the same maximum-window clamp behavior the existing ui-video-trim-modal--maximum-window-clamp check exercises. The hint/duration meta row above the filmstrip (`.timelineMeta`, `trim-selection-duration`) stays local to this component rather than moving into VideoTimeline's own showLeftLabel/showRightLabel slots, because those slots format minutes without a leading zero (\"0:30\") while the pre-existing check here asserts the two-digit \"00:30\" RD's own format uses — relitigating that format wasn't in scope for this change. Two testids moved: `trim-handle-start`/`trim-handle-end` no longer exist (VideoTimeline's own handles carry `canvas-trim-handle-start`/`canvas-trim-handle-end` now, matching its existing `canvas-playback-*` family); the design-library Playwright checks were updated to match. One behavior did not carry over: dragging the playhead used to pause video playback for the drag's duration and resume it on release (via this component's own stop/resume wiring into useTrimDrag); VideoTimeline's own seek path is a native `<input type=range>` with no equivalent hook point, so that pause-while-scrubbing nicety is gone. Not covered by any existing check; judged an acceptable trade-off for one shared implementation over two independently-drifting ones — flagged here rather than silently dropped."
  - "Handle drag no longer clamps to the maximum length (2026-09-15, corrected live — \"handler應該要讓user隨意拉動，而不是根據時間限制鎖死，如果影片是有限制時長的話，user調整範圍若超出hint就會變成紅色的字\"): matches VideoTimeline's own corrected decisionBasis entry of the same date exactly, since this component's handle-drag is VideoTimeline's now. A handle drags freely across the full clip, bounded only by the minimum segment length and the track's own [0, duration] bounds — never by maximumSeconds. VideoTrimModal no longer passes maximumSeconds to <VideoTimeline> at all (VideoTimeline dropped the prop entirely, being otherwise unused once the clamp was removed); it's kept as VideoTrimModal's own prop purely for its local tooLong/errorLabel computation and the confirm-button disable check, both unchanged. The design-library check ui-video-trim-modal--maximum-window-clamp (which asserted the old, incorrect hard-lock-at-30s behavior) was renamed to ui-video-trim-modal--free-drag-past-maximum-shows-error and rewritten to assert: dragging the end handle far past the 30s maximum grows the duration reading past 30s (not clamped) and disables the confirm button — the corrected behavior, not the removed one."
  - "Close (×) and preview play/pause icons swapped from a literal glyph and inline SVGs to the shared icon font (2026-09-15, tried live — \"1和2的icon有點問題，3我不確定，但是都改成icon font看看\", where \"1\"/\"2\" are these two): the close button was a literal \"×\" (U+00D7) character sized via font-size: var(--font-size-heading-3); the preview play/pause toggle was a local <PlayIcon> component with two hand-drawn inline <svg> paths. Both swapped to the same YcoInterfaceIcons icon font ResultPageShell/ToolFamilyMenu already use for their own glyphs: icon-ic-x-bold (U+E945) for close, icon-ic-pause-bold (U+E97B)/icon-ic-play-f (U+E97F) for the preview toggle — each embedded as a JS unicode escape in a `<span>` rather than raw text or inline SVG. <PlayIcon> was deleted entirely once its one remaining call site was replaced (MuteIcon, not flagged by the user, stays inline SVG). A local @font-face (pointing at the same design-library icomoon.woff) was added to this component's own module.scss, following the same per-module-declaration convention ResultPageShell.module.scss already uses. Marked by the user as a wanted change for these two specifically (vs. \"tried, not sure yet\" for VideoTimeline's own play button, marked \"3\" — see that component's own decisionBasis)."
  - "No-maximum state falls back to a plain elapsed-time hint (2026-09-15, asked live — \"但有一種是沒有時間限制的trimer這時候hint要變成00:00\"): a consumer opts into \"no maximum\" the same way as the handle-drag fix above — a non-finite/non-positive maximumSeconds (e.g. Infinity) — computed once as a shared `hasMaximum` boolean, used both to gate the confirm-disable check (already existed) and, new here, to gate what the left slot of the hint row shows. With a real maximum, unchanged: maxLengthLabel (e.g. \"Select 5-30 seconds\"), turning to errorLabel once exceeded. Without one, that hint text does not apply (there's no length to select \"up to\") — the left slot instead shows the elapsed time within the current selection (Math.max(0, currentTime - trimRange.start), this component's own two-digit formatDuration), starting at \"00:00\" before playback begins. Mirrors VideoTimeline's own established fallback for the exact same situation (no hintText given → elapsed-within-selection time in its own single-digit-minute format) rather than inventing a different convention for this component. Decided to expose the no-maximum state via the EXISTING maximumSeconds Control/arg (already a plain number prop on this story) rather than adding a second, dedicated Story for it — asked live which of the two this should be (\"你覺得這是要做在Story還是Control\"); a Control was recommended and used, matching this session's established pattern of collapsing what a Control can already demonstrate rather than adding a parallel Story for it (VideoTimeline's own showTrimHandles/showKeyframe consolidation is the direct precedent) — no new export was added to VideoTrimModal.stories.jsx for this."
  - "Cancel/Use Video now render the shared platform/ui/button Button component (2026-09-15, corrected live — \"disable的buttons你不應該自己亂做，你應該用我們做好的\"): these were plain `<button>` elements with a second, local implementation of pill sizing/coloring and — most relevantly — the disabled state (`.actions button:disabled` in this component's own module.scss), duplicating Button's own canonical Fill/Disabled treatment (one flat grey shared by every tone/variant, per Button's own component contract) rather than reusing it. Cancel is now `<Button variant=\"secondary\" tone=\"neutral\">`; Use Video is `<Button variant=\"primary\" tone=\"brand\">` — both already an exact or near-exact visual match to what this component's own now-removed CSS had hand-built (medium size's 42px min-height/heading-5 font-size lines up with the old 42.5px/heading-5 cancel/confirm pair almost exactly). `.actions button`/`.actions button:last-child`/`.actions button:disabled` were deleted from this component's module.scss rather than left dead — only `.actions` itself (the flex-row layout) remains, since Button now owns everything else. `data-testid` props (`trim-cancel`/`trim-use-video`) pass through unchanged via Button's own `...buttonProps` spread, so the two design-library Playwright checks reading them needed no changes."
  - "Mute/unmute icon swapped from an inline SVG to the shared icon font, then corrected to the right token (2026-09-15, tried live — \"這顆也是錯的，請幫我找icon font\" — then corrected via a Figma Dev Mode inspect of that same icon — \"color 應該是這個\", showing Fill: Icon/Inverse strong): `<MuteIcon>` (a hand-drawn speaker path plus either an X or sound-wave path depending on `muted`) is gone — `.muteButton` now renders icon-ic-volume-x-f (U+E926, muted) / icon-ic-volume-high-f (U+E924, unmuted) directly as its own text content, styled through the same local @font-face this component already added for its other two icons (close, preview play/pause). Color was first left at the pre-existing `--icon-inverse` (a carry-over guess from the button's own base color), then corrected to `--icon-inverse-strong` per the Dev Mode inspect — the two tokens resolve to different literal colors in this token set (`--icon-inverse` = --grey-dark-500, `--icon-inverse-strong` = --grey-dark-1000/white), so this wasn't a no-op fix."
  - "Cancel/Use Video moved into a fixed footer, shadowed only while scrollable (2026-09-15, requested live — \"在做modal的時候，如果下面有CTA我都會讓他 fix at the bottom...等他滑到最底就沒有modal footer的陰影\", matching the Auto-Edit modal convention at jb5SgyshmuPse0L7IFm0QO nodes 14602:212396/14630:282653 [not scrolled — footer floats over content with a shadow] vs 14774:349549/14777:355223 [scrolled to the end — no floating footer/shadow, the CTA sits at the true end of the content]): `.modal` was overflow: auto directly on itself, so `.actions` (Cancel/Use Video) scrolled away with the preview/timeline whenever content exceeded `max-height`. Restructured into `.modal` (now display:flex; flex-direction:column; overflow:hidden, no longer scrolls itself) → `.content` (flex:1; min-height:0, the definite-height link in the chain) → `.body` (the actual scrollable area — flex:1; min-height:0; overflow-y:auto, holds the title/preview/timeline and the padding that used to live on `.modal`) and a sibling `.actions` footer (fixed, its own padding, never scrolls). A new `footerElevated` state (VideoTrimModal.jsx) — computed from `.body`'s scrollHeight/scrollTop/clientHeight via a scroll handler plus a ResizeObserver (content height can change after video metadata/thumbnails load, not just on user scroll) — toggles `.actionsElevated`: a `color-mix(--fill-strong)` box-shadow with a NEGATIVE vertical offset (casts upward into `.body`, same convention as `.modal`'s own downward-offset shadow) that only applies while `.body` has more content below the fold, transitioning out once scrolled to the true bottom. Verified directly in the browser (not just by reading the CSS): forced `.modal`'s max-height down via an inline style to create real overflow, confirmed `.actionsElevated` + a real box-shadow apply, then scrolled `.body` to its true end and confirmed both clear."
  - "Title pulled out of the scrollable area; video preview given a shrink floor instead of shrinking indefinitely (2026-09-15, corrected live — \"你不能弄成現在這樣，你應該是中間要可以scroll\", then \"video 縮小要有一個程度，不是無限縮小\", then confirmed — \"我覺得還是可以根據銀幕縮小影片高度，但是就一個程度就好\"): the fixed-footer restructure above initially put the title inside `.body` alongside the preview/timeline, so it scrolled away with them instead of behaving like a normal modal header — three zones were intended (fixed title, scrollable middle, fixed footer), not two. Title is now `.title`, a fixed sibling of `.body` with its own padding (top+sides matching .modal's old inset, bottom as the gap before .body starts) rather than living inside the scrollable area. Separately, `.preview` (a flex child of `.body`'s column) had no shrink floor at all — flex's own default min-height: auto lets a flex item shrink past its content's intrinsic size once vertical space runs out, so a squeezed modal could shrink the video toward nothing. `flex-shrink` was deliberately left at its default (1) — the video should still shrink as the screen does — with `min-height: var(--spacing-192)` added as the actual floor (192px, about half of `.preview`'s own 336px max-height cap): once the modal is squeezed past the point where the video would need to go below that, `.body` scrolls instead of the video shrinking further. `.timelineSection` got a plain `flex-shrink: 0` (no comparable min-height needed — it doesn't scale with available space the way an aspect-ratio-driven video does, so full rigidity is the right floor for it). Verified directly in the browser: forced `.modal`'s max-height down through several sizes and confirmed `.title` stays put, `.preview` shrinks with the available space until hitting exactly 192px, and `.body`'s scrollHeight then exceeds its clientHeight (i.e. it scrolls) rather than the video going smaller."
  - "Two small icon-treatment corrections (2026-09-15, tried live): mute button background was --fill-overlay-strong, corrected to plain --fill-overlay (\"這底色是overlay不是overlay strong\") — three distinct tokens exist in this set (--fill-overlay/-weak/-strong), and the plain one is the actual spec rather than the alphabetically-adjacent strong variant. Preview play/pause circle was 48px (--spacing-48), corrected to 56px (--spacing-56 — \"這顆是56px\")."
  - "Preview play/pause circle background at 80% opacity, not solid (2026-09-15, asked live — \"然後有白色是有帶80%的透明度，如果沒有這個顏色的token我有辦法用Fill/Inverse strong再去設定80%的透明度嗎\"): confirmed yes — same color-mix(in srgb, var(--TOKEN) X%, transparent) technique this component already uses for its .modal/.actionsElevated shadows, applied here since no dedicated \"white at 80%\" token exists. Was solid var(--fill-white); switched to color-mix(in srgb, var(--fill-inverse-strong) 80%, transparent) — --fill-inverse-strong resolves to the same underlying --grey-solid-0 value as --fill-white, but reads as the more semantically correct token for a button surface floating over video content."
  - "Preview play/pause glyph font-size 32px, not 24px (2026-09-15, requested live — \"font size幫我設32px好了\") — bumped to better fill the 56px circle (see the entry above) now that the circle itself is bigger."
  - "Own instance's testids reverted to trim-handle-start/trim-handle-end/trim-playback-timeline/trim-playback-toggle, no longer VideoTimeline's canvas-* defaults (2026-09-15, found via GitHub Actions' check-runs after the user asked \"這裏為什麼不會顯示\" about a red ✗): the merge-with-VideoTimeline entry above let this component's <VideoTimeline> instance fall through to its canvas-* default testids, which collide with video-expansion's own always-mounted canvas timeline whenever this dialog is open (two elements match the same getByTestId, failing strict mode) — a real regression, not pre-existing. Now passes VideoTimeline's four new testid-override props (playbackTimelineTestId/playbackToggleTestId/trimHandleStartTestId/trimHandleEndTestId — see that component's own decisionBasis) with values matching this component's own pre-merge names, so its instance stays uniquely identifiable. features/video-expansion/product/validation.yaml (which expects trim-handle-start/trim-handle-end) and tools/design-library/run-storybook-checks.mjs's own ui-video-trim-modal--* checks were reverted to match — both had been changed to canvas-trim-handle-* when the collision wasn't yet known."
  - "`.actions` (Cancel/Use Video) moved from a fixed sibling of `.body` into `.body`'s own last child, position:sticky (2026-09-15, requested live — \"螢幕高度不夠才需要做fixed at the bottom\", correcting the entry above): the earlier fix made this footer ALWAYS pinned to the modal's own bottom regardless of whether `.body`'s content actually needed the room, leaving a visible gap between the timeline and the buttons whenever content was short enough to fit on its own. Same fix as ToolPageLayout's own Generate CTA (see that component's decisionBasis): sits right after the timeline when everything fits, only sticks to `.body`'s own bottom edge once content is actually tall enough to scroll. `.actions` picked up its own `background: var(--background-base)` since content can now scroll in the same box behind it while stuck; `footerElevated`/`.actionsElevated` (the scroll-shadow toggle) is unaffected — still computed the same way, unrelated to this structural move."
  - "Close button glyph corrected icon-ic-x-bold (U+E945, 16px) → icon-ic-x-b-regular (U+E943, 24px) (2026-09-15, reported live with a DevTools inspect — \"font size是24px\" / \"icon font我們不要用bold，我們用regular就好\"): the bold glyph and 16px size were both a guess at reading similarly to the literal \"×\" character this replaced; the actual spec is the font's plain (non-bold) X glyph at 24px."
  - "`.actions`'s own background now spans the full modal width while sticky-stuck, not just `.body`'s own padded content width (2026-09-15, reported live — \"整個footer container應該要貼在邊上\"): a negative margin on the new `.actionsFixed` modifier cancels exactly `.body`'s own horizontal padding, and the modifier's own padding restores the same button inset on top of that — background reaches the true edges, buttons stay where they were."
  - "Found and fixed a real bug while chasing why `.actionsFixed`/`.actionsElevated` never applied despite real overflow (2026-09-15, user asked \"是不是 z-index 不對的關係\" — it wasn't): the ResizeObserver-attaching effect depended on `[updateFooterElevation]` only — a `useCallback` stable for the component's entire lifetime — and this component stays mounted throughout (the parent always renders `<VideoTrimModal opened={trimOpen} .../>`, never conditionally), so its very first render happens with `opened=false`, `bodyRef.current` is null at that point, and the effect attached its observer to that null exactly once, never again. Every later time the modal actually opened, `.body` existed but nothing was watching it — confirmed live pre-fix (forcing real overflow left both booleans stuck at their initial false) and post-fix (both flip correctly). Added `opened` to that effect's own dependency array so it re-attaches a fresh observer every time the modal opens, not just the first time this always-mounted component ever rendered. This bug predates today — footerElevated (from the original fixed-footer entry above) was equally broken the whole time, just never actually exercised by a real resize/overflow before now."
