decisionBasis:
  - "Extracted from RD source on 2026-09-15 for Cloud Storage's batch selection, per the shared component workflow: no replacement UI was designed. RD splits the header bar into select-all-header (left) and editing-toolbar (right); both are promoted together because they are two halves of one row and share the same editing state."
  - "portability is `reference`, and the reason is structural rather than incidental. RD's two components take the consuming tab's CSS module as a `styles` prop, so the same markup is styled differently per tab and neither component owns an appearance. A shared component has to own its styling, so that prop is removed and the rules are transcribed from my-gallery-page/tabs/gallery/gallery.module.scss, which is why that stylesheet is listed under sourcePaths alongside the two components."
  - "Service substitutions (2026-09-15): RD's `getTranslationFunction()` is replaced by a `labels` prop with English defaults, per this library's rule that shared components never translate internally. RD also gates the download button behind `browserUtils.isIOs() || isIPad() || isAndroid()`, hiding it on mobile platforms entirely; that platform sniff is dropped and download is simply shown when `onDownload` is supplied, so the consumer decides. The narrow icon-only treatment RD drives from its `isMd` viewport hook becomes the `compact` prop, so it can be kept in step with gallery-grid's measured layout rather than disagreeing with it inside a fixed-width preview."
  - "Colour mapping (2026-09-15) follows app/src/surfaces/rd-port/token-colour-mapping.json for Gallery.module.scss. Exact: `#fff` -> `--fill-white`; `#de0000` delete fill -> `--fill-error-strong` (#de0000); `#000` cancel label -> `--grey-neutral-solid-1000`; `rgb(17 24 26 / 20%)` cancel border -> `--fill-disabled` (#11181a33); `rgb(9 22 26 / 95%)` select-all label -> `--text-strong` (#09161af2)."
  - "Colour mapping, the approximations (2026-09-15), carried from the canonical record rather than re-decided: `#d7d7d7` disabled fill -> `--fill-disabled` (#11181a33) replaces an opaque light grey with a translucent slate, so a disabled pill now takes on the page behind it; `#46e4fa` hover -> `--blue-dark-1000` (#a3eaff) is a noticeably paler cyan; `#dddee6` unchecked checkbox border -> `--fill-disabled` (#11181a33) shifts a cool grey ring to translucent slate. All three stay pending Designer definition."
  - "Accessibility repair in the port (2026-09-15). RD's select-all renders a styled `<span>` with the click handler plus a bare `<input type=\"checkbox\">` that has no checked binding and no label association, so the real control is inert and the visible one is unreachable by keyboard. Here the input is the control — checked, changed and labelled — and the styled span is decorative, with focus forwarded to it via `:focus-visible + .checkbox`. The rendered appearance is unchanged."
  - "The tip slot stays a `children` slot, as in RD, because the gallery passes plain text while other tabs pass sanitised HTML. This component takes the resolved node and never sanitises, so an HTML consumer keeps that responsibility."
  - "Typography approximation (2026-09-15): RD's `.selectButton`, `.deleteButton` and `.downloadButton` drop to `font-weight: 500` below 768px, and the token set carries only `--font-weight-strong` (600) and `--font-weight-weak` (400). `--font-weight-weak` is used, so the narrow-width labels render regular where production renders medium — a visible difference, not a rounding. The desktop 600 maps exactly. RD's narrow `font-size: 16px` / `line-height: 19px` also have no matching token pair and are kept as literals, which the raw-colour policy permits because they are not colours."
  - "Button consolidation (2026-09-15, PM requested): Select/Cancel now renders the Designer-approved shared Button rather than carrying a second local pill implementation. Browsing maps to Primary/Brand/Small; selecting maps to Secondary/Neutral/Small. Delete and Download remain the RD toolbar controls because this request only resolves the Select toggle and their icon-only compact behavior is not represented by the Button component."
  - "Ghost variant, added 2026-09-16 at PM request after the selection UI was reviewed. RD's row is three filled pills — a brand Select/Cancel, a red Delete and an outlined Download — which in a selection bar outweighs the content being acted on. `variant=\"ghost\"` keeps RD's markup and drops the fills: icon plus label on a transparent ground, the destructive action carrying colour rather than a filled background, and a leading close control that leaves selection mode (RD expresses that as the Cancel pill, which ghost hides). `default` is unchanged, so RD's own treatment is still what a caller gets without asking."
  - "Tokens added for the ghost variant only: --fill-hover for the action hover ground, --text-error for the destructive action, --text-weaker for a disabled action, --corner-radius-8, --spacing-4/8/16 and --stroke-focus for the focus ring. No new colour was introduced and RD's own rules were not edited."
  - "Ghost slots and order, 2026-09-16. `children` sits between the close control and the actions, which is where a selection bar puts its count, its size and select-all; `extraActions` sits before the destructive action, so a consumer's own action (Cloud Storage's move-to-folder, which RD has no counterpart for) lands in the group without delete losing last place. Ghost also renders download before delete, matching the reference bar's export / move / delete order. RD's default keeps its own order — delete first — untouched."
  - "Ghost-variant glyphs are masked rather than painted, 2026-09-16. RD ships these icons as white artwork for its filled pills; on the ghost row the ground is the page, so an `<img>` of one was white on white and the PM reported the bar as having no icons. `.ghostGlyph` sets `background-color: currentColor` and masks the same asset, so one file serves both grounds and the destructive action's `var(--text-error)` now reaches its trash glyph as well as its label. RD's own filled variant still renders the plain `<img>`, unchanged."
