# Resolved by the Product Owner on 2026-09-03.
resolved:
  - id: SM-001
    ruling: >-
      SEO landing routes stay out of scope: prototypes never target them. Only two
      representative page entries are vendored so the shape integration.yaml
      prescribes stays checkable. See manifest.pageEntryReference.
  - id: SM-003
    ruling: >-
      The module-to-category mapping is recorded by hand rather than derived, because
      the sidebar resolves it at runtime from CMS-supplied items. It is not in this
      generated file; put it in a hand-maintained record when the CMS export arrives.
openQuestions:
  - id: SM-002
    question: >-
      62 moduleTypes carry no crossPromoteTypes category, so they belong to no
      tool family. Are they retired, internal, or simply missing from the sidebar?
    owner: pm
    # Reachability narrows the question. productUrls and headerProducts are separate
    # route sources, so both are checked: a module in neither is the one worth asking
    # about, and there are far fewer of those than the headline count suggests.
