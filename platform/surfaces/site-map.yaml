# Resolved by the Product Owner on 2026-09-03.
resolved:
  - id: SM-001
    ruling: >-
      SEO landing routes stay out of scope: prototypes never target them. Only two
      representative page entries are vendored so the shape integration.yaml
      prescribes stays checkable. See manifest.pageEntryReference.
  - id: SM-002
    ruling: >-
      Answered on 2026-09-04. The generator classifies each uncategorised module and
      the Product Owner ruled the rest in module-dispositions.yaml. It also uncovered a
      defect: productUrls and headerProducts are keyed by effect, not module id, so ten
      live tools had been reported as having no route at all.
  - id: SM-003
    ruling: >-
      Corrected on 2026-09-04. The earlier ruling said the module-to-category mapping
      was resolved at runtime from CMS items and had to be recorded by hand once a CMS
      export arrived. That was wrong: crossPromoteMenuMapping in sideBarMenuUtils.js
      declares it statically, naming the moduleType and target URL of every product.
      It is now derived, in sidebarMenu above. No CMS export is needed.
